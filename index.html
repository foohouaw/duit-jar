/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close],label"); if(!t) return;
  if(t.classList.contains("scrim")&&e.target!==t) return;
  const ds=t.dataset;
  if(extClick(t,ds)) return;
  if(t.id==="prevM"){S.view=shiftMonth(S.view,S.tab==="year"?-12:-1);render();return}
  if(t.id==="nextM"){S.view=shiftMonth(S.view,S.tab==="year"?12:1);render();return}
  if(t.id==="tabDaily"){S.tab="daily";render();return}
  if(t.id==="tabCats"){S.tab="cats";render();return}
  if(t.id==="tabYear"){S.tab="year";render();return}
  if(ds.undo){ const f=UNDO; $("toastRoot").innerHTML=""; UNDO=null; if(f) f(); return }
  if(t.id==="privBtn"){ PRIV=!PRIV; try{localStorage.setItem("duitjar.private",PRIV?"1":"0")}catch(e){} applyPriv(); say(PRIV?"Shh… amounts are hidden 🤫":"Amounts are back!","",2500); return }
  if(t.id==="openSearch"){openSearch();return}
  if(t.id==="monthLabel"){openMonthPicker();return}
  if(t.id==="navStats"){S.page="stats";window.scrollTo(0,0);render();buddyIdle();return}
  if(ds.ar&&!t.closest(".sheet")){S.af.r=ds.ar;render();return}
  if("aw" in ds&&!t.closest(".sheet")){S.af.w=ds.aw||null;render();return}
  if(t.id==="navHome"){S.page="home";window.scrollTo(0,0);render();buddyIdle();return}
  if(t.id==="navGoals"){S.page="goals";window.scrollTo(0,0);render();buddyIdle();return}
  if(ds.bprof){openProfile();return}
  if(t.id==="dogBtn"){petDog();return}
  if(t.id==="addBtn"){ if(S.page==="goals"){ if(S.plan==="subs") openSub(null); else openGoal(null) } else openEditor(); return }
  if(ds.act==="add"){openEditor();return}
  if(t.id==="openSettings"){openSettings();return}
  if(ds.act==="budget"){openSettings("budget");return}
  if(ds.act==="import"){openSettings("import");return}
  if("wf" in ds && !t.closest(".sheet")){S.wf=ds.wf||null;render();return}
  if(ds.gomonth){S.view=ds.gomonth;S.tab="daily";render();window.scrollTo(0,0);return}
  if("catd" in ds){openCatDetail(ds.catt,ds.catd,ds.scope);return}
  if(ds.goal){openGoalDetail(ds.goal);return}
  if(ds.backup){doBackup();return}
  if(ds.gsync){gdSyncNow();return}
  if(ds.bklater){BK_SNOOZE=true;renderBkCard();return}
  if(ds.gosubs){S.page="goals";S.plan="subs";window.scrollTo(0,0);render();buddyIdle();return}
  if(ds.plan&&!t.closest(".sheet")){S.plan=ds.plan;render();buddyIdle();return}
  if(ds.sub&&!t.closest(".sheet")){openSub(ds.sub);return}
  if("newsub" in ds){openSub(null,ds.newsub,ds.sic);return}
  if(ds.cmopen){syncFields();openCatManager(ds.cmopen);return}
  if("newgoal" in ds){openGoal(null,ds.newgoal,ds.gic);return}
  if(ds.edit){openView(ds.edit,false);return}
  if(ds.close){ closeAll(); return }
  if(ds.back){ if(CE){CE=null} else if(WE){WE=null} else if(CM){CM=null} else if(GE){GE=null} draw(); return }
  if(ds.addwallet){ syncFields(); syncGoal(); openWallet(null); return }
  if(ds.editwallet){ openWallet(ds.editwallet); return }
  if(ds.recstop){ stopRec(ds.recstop); return }

  if(CE){
    if(ds.emoji){syncCat();CE.ic=ds.emoji;drawCat();return}
    if(ds.cet){syncCat();CE.t=ds.cet;drawCat();return}
    if(t.id==="catSave"){saveCat();return}
    if(ds.cdel){syncCat();CE.confirm=true;drawCat();return}
    if(ds.cdelno){syncCat();CE.confirm=false;drawCat();return}
    if(ds.cdelyes){removeCat();return}
    return;
  }
  if(WE){
    if(ds.kind){syncWallet();WE.kind=ds.kind;drawWallet();return}
    if(ds.wcolor){syncWallet();WE.color=ds.wcolor;drawWallet();return}
    if(t.id==="wSave"){saveWallet();return}
    if(ds.wdel){syncWallet();WE.confirm=true;drawWallet();return}
    if(ds.wdelno){syncWallet();WE.confirm=false;drawWallet();return}
    if(ds.wmove){syncWallet();WE.moveTo=ds.wmove;drawWallet();return}
    if(ds.wdelyes){deleteWallet(ds.wdelyes);return}
    return;
  }
  if(EV&&!ED&&!CE&&!WE&&!CM){
    if(ds.evedit){ const id=EV.id; EV=null; openEditor(id); return }
    if(ds.evdup){ const f=findTx(EV.id); EV=null; if(f) dupEntry(f.x); return }
    if(ds.evdel){ EV.confirm=true; drawView(); return }
    if(ds.evdelno){ EV.confirm=false; drawView(); return }
    if(ds.evdelyes){ deleteTx(EV.id); return }
    if(ds.evmore){ EV.menu=false; drawView(); return }
    return;
  }
  if(CM){
    if(ds.cmt){CM.t=ds.cmt;drawCatManager();return}
    if(ds.cmedit){openCat(CM.t,ds.cmedit);return}
    if(ds.cmnew){openCat(CM.t,null);return}
    if(ds.cmdel){cmDelete(ds.cmdel);return}
    if(ds.cmreset){cmReset();return}
    return;
  }
  if(ED){
    if(ds.type){syncFields(); if(ED.t==="a") ED.sign=1; ED.t=ds.type; if(ED.t!=="x"){const f=catList(ED.t)[0];ED.c=f[0];ED.ic=f[1]} else if(!ED.to||ED.to===ED.w){ED.to=(wallets().find(w=>w.id!==ED.w)||{}).id||null} drawEditor();return}
    if(ds.cat){syncFields();ED.c=ds.cat;ED.ic=ds.ic;drawEditor();return}
    if(ds.newcat){syncFields();openCat(ED.t,null);return}
    if(ds.pickw){syncFields(); if(ds.role==="to") ED.to=ds.pickw; else { ED.w=ds.pickw; if(ED.to===ED.w) ED.to=(wallets().find(w=>w.id!==ED.w)||{}).id||null } drawEditor();return}
    if(ds.recent){ const f=findTx(ds.recent); if(f){ syncFields(); const x=f.x; ED.c=x.c; ED.ic=x.ic||iconFor(x.t,x.c); ED.n=x.n||""; ED.amt=String(x.a); if(wallets().some(w=>w.id===wOf(x))) ED.w=wOf(x); drawEditor() } return }
    if(ds.dq){ syncFields(); ED.d=ds.dq==="0"?today():yday(); drawEditor(); return }
    if(ds.rep){ syncFields(); ED.rep=!ED.rep; drawEditor(); return }
    if(ds.key){pressKey(ds.key);return}
    if(t.id==="saveBtn"){saveEntry();return}
    if(ds.del){syncFields();ED.confirm=true;drawEditor();const c=document.querySelector(".sheet .confirm");if(c)c.scrollIntoView({block:"center",behavior:"smooth"});return}
    if(ds.delno){syncFields();ED.confirm=false;drawEditor();return}
    if(ds.delyes){deleteEntry();return}
    return;
  }
  if(SE){
    if(ds.subp){syncSub();SE.name=ds.subp;SE.ic=ds.sic;drawSub();return}
    if(ds.sem){syncSub();SE.ic=ds.sem;drawSub();return}
    if(ds.scy){syncSub();SE.cycle=ds.scy;drawSub();return}
    if(ds.sw){syncSub();SE.w=ds.sw;drawSub();return}
    if(ds.sauto){syncSub();SE.auto=!SE.auto;drawSub();return}
    if(ds.spause){syncSub();SE.paused=!SE.paused;drawSub();return}
    if(ds.spay){paySub();return}
    if(t.id==="sSave"){saveSub();return}
    if(ds.sdel){syncSub();SE.confirm=true;drawSub();return}
    if(ds.sdelno){syncSub();SE.confirm=false;drawSub();return}
    if(ds.sdelyes){S.settings.subs=(S.settings.subs||[]).filter(x=>x.id!==SE.id);persistSettings();closeAll();render();toast("Subscription deleted");return}
    return;
  }
  if(GE){
    if(ds.gemoji){syncGoal();GE.ic=ds.gemoji;drawGoalEditor();return}
    if(ds.gmode){syncGoal();GE.mode=ds.gmode;drawGoalEditor();return}
    if(ds.gw){syncGoal();GE.w=ds.gw;drawGoalEditor();return}
    if(t.id==="gSave"){saveGoal();return}
    return;
  }
  if(GD){
    if(ds.gadd){addToGoal(+ds.gadd);return}
    if(ds.gdel){GD.del=ds.gdel;drawGoalDetail();return}
    if(ds.gdelyes){const g=S.goals.find(x=>x.id===GD.id); if(g){g.adds=(g.adds||[]).filter(a=>a.id!==ds.gdelyes); persistGoals()} GD.del=null; draw(); render(); return}
    if(ds.gedit){openGoal(GD.id);return}
    if(ds.gremove){GD.confirm=true;drawGoalDetail();return}
    if(ds.gremoveno){GD.confirm=false;drawGoalDetail();return}
    if(ds.gremoveyes){S.goals=S.goals.filter(x=>x.id!==GD.id); persistGoals(); closeAll(); render(); toast("Goal deleted"); return}
    if(ds.gtransfer){const g=S.goals.find(x=>x.id===GD.id); openEditor(null); ED.t="x"; ED.to=g.w; if(ED.w===g.w) ED.w=(wallets().find(w=>w.id!==g.w)||{}).id||ED.w; draw(); return}
    return;
  }
  if(MP){
    if(ds.mpy){MP.y+=+ds.mpy;drawMonthPicker();return}
    if(ds.mpyset){MP.y=+ds.mpyset;drawMonthPicker();return}
    if(ds.pickm){S.view=ds.pickm;closeAll();render();return}
    if(ds.picky){S.view=ds.picky+S.view.slice(4);closeAll();render();return}
    return;
  }
  if(SR){
    if(ds.st){const i=$("searchIn"); if(i) SR.q=i.value; SR.t=ds.st; drawSearch(); return}
    return;
  }
  if(CD){
    if(ds.editcd){openCat(CD.t,CD.c);return}
    return;
  }
  if(BPV&&!CE&&!WE){
    if(ds.feed){feedPet(+ds.feed);return}
    if(ds.bptab){BPV.tab=ds.bptab;drawProfile();return}
    if(ds.item){tapItem(ds.item);return}
    if(ds.bpseason){const b=bud(); b.seasonal=b.seasonal===false; persistSettings(); renderBuddyShell(); refreshBubble(); drawProfile(); return}
    if(ds.pet){ const n=$("dogName"); const nm=n?n.value.trim():""; const isDef=!nm||Object.values(PETS_T).some(p=>p.def===nm); S.settings.pet=ds.pet; if(isDef) delete S.settings.dog; else S.settings.dog=nm; persistSettings(); renderBuddyShell(); say("Hi! I'm "+dogName()+" "+petT().emo,"happy",4000); drawProfile(); return }
    return;
  }
  if(ST){
    if(ds.gconnect){gdConnect();return}
    if(ds.grestore){gdRestore();return}
    if(ds.grid){gdRestoreId(ds.grid);return}
    if(ds.glistno){ST.gdList=null;drawSettings();return}
    if(ds.gdisc){gdDisconnect();return}
    if(ds.gkeep){gdKeepPhone();return}
    if(ds.guse){gdUseDrive();return}
    if(ds.bkr){S.settings.bkRemind=ds.bkr;persistSettings();drawSettings();render();return}
    if(ds.rsno){ST.restore=null;drawSettings();return}
    if(ds.rsyes){applyRestore();return}
    if(ds.lang){ S.settings.lang=ds.lang; persistSettings(); applyLang(ds.lang); render(); drawSettings(); renderBuddyShell(); buddyIdle(); return }
    if(ds.pet){ const n=$("dogName"); const nm=n?n.value.trim():""; const isDef=!nm||Object.values(PETS_T).some(p=>p.def===nm); S.settings.pet=ds.pet; if(isDef) delete S.settings.dog; else S.settings.dog=nm; persistSettings(); renderBuddyShell(); say("Hi! I'm "+dogName()+" "+petT().emo,"happy",4000); drawSettings(); return }
    if(ds.pal){S.settings.palette=ds.pal;applyPalette();persistSettings();drawSettings();return}
    if(ds.ct){ST.ct=ds.ct;drawSettings();return}
    if(ds.editcat){openCat(ST.ct,ds.editcat);return}
    if(ds.newcat){openCat(ST.ct,null);return}
    if(ds.swap){ST.order=ST.order==="dmy"?"mdy":"dmy";try{ST.parsed=parseRows(ST.rows,ST.order);ST.parsed.ambiguous=true}catch(err){} drawSettings();return}
    if(ds.doimport){doImport();return}
    if(ds.export){exportCSV();return}
    if(ds.wipe){ST.wipe=true;drawSettings();return}
    if(ds.wipeno){ST.wipe=false;drawSettings();return}
    if(ds.wipeyes){wipeAll();return}
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="fileIn"&&ST){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    ST.file=f.name; ST.busy=true; ST.error=null; ST.parsed=null; drawSettings();
    try{ ST.rows=await readFile(f); ST.parsed=parseRows(ST.rows,ST.order); ST.order=ST.parsed.order }
    catch(err){ ST.error=err&&err.message&&!/^load$/.test(err.message)?err.message:"That file couldn't be read. Try the Excel export from Money Manager, or a CSV." }
    ST.busy=false; drawSettings();
  }
  if(e.target.id==="dateIn"&&ED){ syncFields(); drawEditor() }
  if(e.target.id==="restoreIn"&&ST){ const f=e.target.files&&e.target.files[0]; if(f) readRestore(f) }
  if(e.target.id==="budgetIn"){ const v=Math.max(0,parseFloat(e.target.value)||0); S.settings.budget=Math.round(v*100)/100; persistSettings(); render() }
  if(e.target.id==="curIn"){ S.settings.cur=e.target.value.trim()||"RM"; persistSettings(); render(); drawSettings() }
  if(e.target.id==="dogName"){ S.settings.dog=e.target.value.trim(); persistSettings(); renderBuddyShell(); say("Hi! I'm "+dogName()+" now 🐾","happy",4000) }
});
document.addEventListener("input",e=>{ if(e.target.id==="searchIn"&&SR){ SR.q=e.target.value; renderSearchRes() } });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("sheetRoot").innerHTML){ if(CE||WE||GE||CM){ CE=WE=GE=CM=null; draw() } else closeAll(); return }
  if(ED&&!CE&&!WE&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(/^[0-9]$/.test(e.key)) pressKey(e.key); else if(e.key===".") pressKey("."); else if(e.key==="+") pressKey("+"); else if(e.key==="-") pressKey("−"); else if(e.key==="Backspace") pressKey("⌫"); else if(e.key==="Enter") saveEntry();
  }
});

document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.mode!=="loading"){ afterLoadRecurring(); gdSchedule() } });
(function(){ let sx=null,sy=0,t0=0; const hp=$("homePage");
  hp.addEventListener("touchstart",e=>{ if(e.touches.length!==1||e.target.closest(".wstrip,.chips,.tabs,.chart")){sx=null;return} sx=e.touches[0].clientX; sy=e.touches[0].clientY; t0=Date.now() },{passive:true});
  hp.addEventListener("touchend",e=>{ if(sx==null) return; const tc=e.changedTouches[0]; const dx=tc.clientX-sx, dy=tc.clientY-sy; sx=null;
    if(Math.abs(dx)>70&&Math.abs(dy)<45&&Date.now()-t0<700){ const step=S.tab==="year"?12:1; S.view=shiftMonth(S.view,dx<0?step:-step); render(); const m=$("main"); m.classList.remove("slide-l","slide-r"); void m.offsetWidth; m.classList.add(dx<0?"slide-l":"slide-r") } },{passive:true});
})();
document.addEventListener("touchmove",e=>{ if(e.touches&&e.touches.length>1) e.preventDefault() },{passive:false});
init();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})) }
})();
</script>

</body>
</html>

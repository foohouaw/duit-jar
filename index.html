<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duit Jar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Duit Jar</title>
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#ECEEF8}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Coin-jar hero, a sideways strip of wallets, then the day-grouped ledger; a thumb-reach Add button fixed at the bottom. Palettes swap four seed colours; everything else is mixed from them. */
:root{
  --bg-l:#ECEEF8; --bg-d:#14151E; --exp:#D97A8F; --inc:#5FA585; --lid:#F4CF7B;
  --bg:var(--bg-l); --card:#FFFFFF; --ink:#2A2B3A; --muted:#7B7E93;
  --line:color-mix(in srgb,var(--ink) 11%,var(--card));
  --chip:color-mix(in srgb,var(--bg) 75%,var(--card));
  --glass:color-mix(in srgb,var(--bg) 45%,var(--card));
  --exp-soft:color-mix(in srgb,var(--exp) 17%,var(--card));
  --inc-soft:color-mix(in srgb,var(--inc) 20%,var(--card));
  --lid-deep:color-mix(in srgb,var(--lid) 72%,#5a3d00);
  --on-accent:#FFFFFF;
  --fur:#FFFFFF; --fur-ear:#F6EDE1; --fur-line:#DCD3C6;
  --shadow:0 6px 22px color-mix(in srgb,var(--ink) 9%,transparent);
  --scrim:rgba(24,24,40,.36);
  --display:"Quicksand","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-palette="matcha"]{--bg-l:#EDF0E4;--bg-d:#131610;--exp:#C88A60;--inc:#6F9A52;--lid:#EBC77E}
:root[data-palette="peach"]{--bg-l:#FBEEE8;--bg-d:#1B1513;--exp:#E2786A;--inc:#3FA197;--lid:#F5C86A}
:root[data-palette="lavender"]{--bg-l:#F1EEF8;--bg-d:#17141F;--exp:#C47AA4;--inc:#6E93D3;--lid:#F2D68C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--bg-d); --card:color-mix(in srgb,var(--bg-d),#ffffff 7%); --ink:#ECEDF4; --muted:#9C9FB4;
  --exp-soft:color-mix(in srgb,var(--exp) 24%,var(--card)); --inc-soft:color-mix(in srgb,var(--inc) 26%,var(--card));
  --shadow:0 6px 22px rgba(0,0,0,.32); --scrim:rgba(0,0,0,.55); --fur:#F5F1EA; --fur-ear:#E8DDCC; --fur-line:#A89E8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--bg-d); --card:color-mix(in srgb,var(--bg-d),#ffffff 7%); --ink:#ECEDF4; --muted:#9C9FB4;
  --exp-soft:color-mix(in srgb,var(--exp) 24%,var(--card)); --inc-soft:color-mix(in srgb,var(--inc) 26%,var(--card));
  --shadow:0 6px 22px rgba(0,0,0,.32); --scrim:rgba(0,0,0,.55); --fur:#F5F1EA; --fur-ear:#E8DDCC; --fur-line:#A89E8F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid color-mix(in srgb,var(--inc) 70%,transparent);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:14px 130px;display:flex;flex-direction:column;gap:16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:10px;background:var(--lid);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#5a3d00;box-shadow:inset 0 -3px 0 var(--lid-deep)}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted)}
.month button:active{background:var(--chip)}
.month span{font-family:var(--display);font-weight:700;min-width:100px;text-align:center;font-size:15px}

/* hero */
.hero{background:var(--card);border-radius:28px;padding:18px;display:grid;grid-template-columns:88px 1fr;gap:18px;align-items:center;box-shadow:var(--shadow)}
.jar{width:88px;height:auto;display:block}
.jar .glass{fill:var(--glass);stroke:var(--line);stroke-width:3}
.jar .lid{fill:var(--lid)} .jar .lid-edge{fill:var(--lid-deep)} .jar .slot{fill:#5a3d00;opacity:.5}
.jar .liquid{fill:var(--inc-soft);transition:y .7s cubic-bezier(.3,1.3,.5,1),height .7s cubic-bezier(.3,1.3,.5,1)}
.jar.over .liquid{fill:var(--exp-soft)}
.jar .coin{fill:var(--lid);stroke:var(--lid-deep);stroke-width:1.5}
.jar .shine{fill:none;stroke:var(--card);stroke-width:3;stroke-linecap:round;opacity:.85}
.hero-body{min-width:0;display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(28px,8.4vw,36px);line-height:1.05;overflow-wrap:anywhere}
.big small{font-size:.48em;font-weight:600;color:var(--muted);margin-right:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--muted)}
.pill b{color:var(--ink);font-weight:800}
.pill.good{background:var(--inc-soft)} .pill.good b{color:var(--inc)}
.pill.bad{background:var(--exp-soft)} .pill.bad b{color:var(--exp)}
.link{color:var(--inc);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* wallets strip */
.wstrip{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.wcard{flex:0 0 auto;width:auto;min-width:138px;max-width:240px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent}
.wcard[aria-pressed="true"]{border-color:var(--ink)}
.wcard .wname{font-weight:800;font-size:13px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wbal{font-family:var(--display);font-weight:700;font-size:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wbal.neg{color:var(--exp)}
.wcard.add{justify-content:center;align-items:center;color:var(--muted);background:transparent;box-shadow:none;border:2px dashed var(--line);font-weight:800;font-size:13px;width:110px}
.wicon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--wc) 16%,var(--card));color:var(--wc)}
.wicon.sm{width:24px;height:24px;border-radius:8px} .wicon.sm svg{width:15px;height:15px}
.wicon.all{--wc:var(--ink)}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.filterbar .l{display:flex;align-items:center;gap:8px;min-width:0}
.filterbar .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filterbar .r{display:flex;gap:6px}
.mini{padding:6px 10px;border-radius:10px;background:var(--chip);font-weight:800;font-size:12.5px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:16px;padding:4px;gap:4px;border:1px solid var(--line)}
.tabs button{padding:9px 0;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 7%,transparent)}

/* ledger */
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 6px;font-weight:800;font-size:13px;color:var(--muted)}
.day-card{background:var(--card);border-radius:22px;padding:4px 12px;box-shadow:var(--shadow)}
.tx{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0}
.tx + .tx{border-top:1px dashed var(--line)}
.bubble{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:21px;background:var(--exp-soft)}
.bubble.inc{background:var(--inc-soft)} .bubble.neu{background:var(--chip);color:var(--muted)}
.tx-main{min-width:0}
.tx-cat{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-note{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.amt.inc{color:var(--inc)} .amt.neu{color:var(--muted)}
.gap{height:14px}

/* empty */
.empty{background:var(--card);border-radius:24px;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:var(--shadow)}
.empty h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:15px}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.soft{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn[disabled]{opacity:.45;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* stats */
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px}
.catrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.catrow .bubble{width:34px;height:34px;border-radius:12px;font-size:17px}
.catrow .meta{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.catrow .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .meta span:last-child{color:var(--muted);font-weight:700}
.bar{height:9px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--exp)}
.bar.inc i{background:var(--inc)}
.chart svg{width:100%;height:auto;display:block}
.chart .col{fill:var(--exp-soft)} .chart .col.today{fill:var(--exp)}
.chart .axis{fill:var(--muted);font:700 9px var(--body)}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}

/* add button */
.fab-wrap{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;background:linear-gradient(to top,var(--bg) 45%,transparent)}
.fab{pointer-events:auto;height:58px;padding:0 26px 0 18px;border-radius:22px;background:var(--ink);color:var(--card);font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 26px color-mix(in srgb,var(--ink) 30%,transparent)}
.fab span{width:32px;height:32px;border-radius:11px;background:var(--lid);color:#4d3600;display:grid;place-items:center;font-size:22px;line-height:1}
.fab:active{transform:scale(.97)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:94%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--chip);padding:4px;border-radius:16px}
.seg button{padding:9px 4px;border-radius:12px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button[aria-pressed="true"].e{background:var(--exp);color:var(--on-accent)}
.seg button[aria-pressed="true"].i{background:var(--inc);color:var(--on-accent)}
.amount-display{font-family:var(--display);font-weight:700;font-size:44px;text-align:center;line-height:1.1;padding:2px 0;overflow-wrap:anywhere}
.amount-display small{font-size:20px;color:var(--muted);margin-right:6px}
.amount-display.zero{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;border:2px solid transparent;font-size:11.5px;font-weight:800;color:var(--muted);min-width:0}
.cat em{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:15px;background:var(--chip);display:grid;place-items:center}
.cat span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.cat[aria-pressed="true"] em{background:color-mix(in srgb,var(--lid) 35%,var(--card))}
.cat.dashed em{border:2px dashed var(--line);background:transparent;font-size:20px;color:var(--muted)}
.wpick{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.wrow::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:14px;background:var(--chip);border:2px solid transparent;font-weight:800;font-size:13.5px;white-space:nowrap}
.wchip[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.field{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);width:100%;min-width:0}
input.field::placeholder{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:50px;border-radius:16px;background:var(--chip);font-family:var(--display);font-weight:700;font-size:22px}
.keypad button:active{background:var(--line)}
.save{height:54px;border-radius:18px;background:var(--ink);color:var(--card);font-family:var(--display);font-weight:700;font-size:18px}
.save[disabled]{opacity:.4}
.confirm{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--exp-soft);border-radius:16px;padding:10px 12px;font-weight:700;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.warn{font-size:13.5px;color:var(--exp);font-weight:700;margin:0}

/* pickers */
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emoji-grid button{aspect-ratio:1;max-width:100%;border-radius:12px;font-size:22px;display:grid;place-items:center;border:2px solid transparent}
.emoji-grid button[aria-pressed="true"]{border-color:var(--ink);background:var(--chip)}
.emoji-group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:4px}
.preview-cat{display:flex;align-items:center;gap:12px}
.kind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kind-grid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;border:2px solid transparent;font-size:11.5px;font-weight:800;color:var(--muted)}
.kind-grid button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--sw);border:3px solid var(--card);box-shadow:0 0 0 2px transparent}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.palettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;font-weight:800;font-size:13.5px;text-align:left}
.pal[aria-pressed="true"]{border-color:var(--ink)}
.pal .dots{display:flex}
.pal .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--card);margin-left:-6px}
.pal .dots i:first-child{margin-left:0}

/* settings */
.set-block{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.set-block h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.set-block p{margin:0;color:var(--muted);font-size:13.5px}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.preview .kv{display:flex;justify-content:space-between;gap:8px}
.preview .kv span:first-child{color:var(--muted)}
.preview .kv b{text-align:right}
.inline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.wlist{display:flex;flex-direction:column;gap:6px}
.wline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px 10px;text-align:left;font-weight:800}
.wline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wline .num{color:var(--muted);font-weight:700}
.status{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--inc);flex:none}
.dot.local{background:var(--lid-deep)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

/* v4 additions */
[hidden]{display:none!important}
.top-r{display:flex;gap:8px}
@media (max-width:440px){.brand span{display:none}}
.page{display:flex;flex-direction:column;gap:16px}
.catrow{width:100%;text-align:left;padding:3px 0;border-radius:12px}
.buddy{display:flex;align-items:flex-end;gap:10px;margin-bottom:-6px}
.dogbtn{flex:none;border-radius:20px}
.dogwrap{position:relative;display:block;width:78px}
.dog{width:78px;height:auto;display:block;overflow:visible;transform-origin:60px 112px}
.dog .o circle{fill:var(--fur-line);stroke:var(--fur-line);stroke-width:5}
.dog .tail{transform-origin:94px 90px;transform-box:view-box;animation:wag 1.1s ease-in-out infinite alternate}
.dog.happy .tail{animation-duration:.16s}
.dog.sad .tail{animation:none;transform:rotate(22deg)}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}

(function(){

  gift:{label:"Other",svg:'<rect x="3.5" y="9" width="17" height="11" rx="2"/><path d="M2.5 9h19M12 9v11M12 9c-1.5-3-5-3.5-5-1.5S10 9 12 9zm0 0c1.5-3 5-3.5 5-1.5S14 9 12 9z"/>'}
};
const WCOLORS = ["#3D7BD9","#2E9E8F","#E0635A","#F0A43A","#8A6FD1","#D86FA5","#5B8C4A","#5A6478"];
const PALETTES = {blueberry:["Blueberry milk","#ECEEF8","#D97A8F","#5FA585"],matcha:["Matcha latte","#EDF0E4","#C88A60","#6F9A52"],peach:["Peach soda","#FBEEE8","#E2786A","#3FA197"],lavender:["Lavender","#F1EEF8","#C47AA4","#6E93D3"]};

const S = { months:{}, settings:{cur:"RM",budget:0}, goals:[], view:ymOf(new Date()), tab:"daily", page:"home", mode:"loading", wf:null };
let DB=null, BASE=null, DL=null, UNSUB=null;
const pending={}, chains={};
let ED=null, ST=null, CE=null, WE=null, SR=null, CD=null, GE=null, GD=null;

/* ---------- utils ---------- */
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function ymOf(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function today(){return ymd(new Date())}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){return (Math.round(n*100)/100).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2})}
function cur(){return S.settings.cur||"RM"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function $(id){return document.getElementById(id)}
function monthName(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}
function shiftMonth(ym,k){const [y,m]=ym.split("-").map(Number);return ymOf(new Date(y,m-1+k,1))}
function fmtD(d){const [Y,M,D]=d.split("-").map(Number);return new Date(Y,M-1,D).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function toast(msg){const r=$("toastRoot");r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{r.innerHTML=""},2800)}
const EMO=/^((?:\p{Extended_Pictographic}|\p{Regional_Indicator})(?:[️‍]|\p{Extended_Pictographic}|\p{Emoji_Modifier})*)\s*/u;
function splitEmoji(name){const s=String(name||"").trim();const m=s.match(EMO);return m?{ic:m[1],name:s.slice(m[0].length).trim()}:{ic:null,name:s}}
function applyPalette(){const p=S.settings.palette||"blueberry";document.documentElement.dataset.palette=p;try{localStorage.setItem("duitjar.palette",p)}catch(e){}}
try{const p=localStorage.getItem("duitjar.palette"); if(p) document.documentElement.dataset.palette=p}catch(e){}

/* ---------- wallets ---------- */
const DEFAULT_W={id:"w-cash",name:"Cash",kind:"cash",color:"#5B8C4A",open:0};
function wallets(){const w=S.settings.wallets;return (w&&w.length)?w:[DEFAULT_W]}
function ensureWallets(){if(!S.settings.wallets||!S.settings.wallets.length){S.settings.wallets=[Object.assign({},DEFAULT_W)];return true}return false}
function wOf(x){return x.w||wallets()[0].id}
function wallet(id){return wallets().find(w=>w.id===id)||{id,name:"Unknown wallet",kind:"gift",color:"#5A6478",open:0}}
function wIcon(w,sm){const k=KINDS[w.kind]||KINDS.bank;return '<span class="wicon'+(sm?' sm':'')+'" style="--wc:'+esc(w.color||"#5A6478")+'" aria-hidden="true"><svg class="i" viewBox="0 0 24 24">'+k.svg+'</svg></span>'}
function guessKind(n){n=String(n).toLowerCase();
  if(/tng|touch|grab|boost|shopee|e-?wallet|bigpay|setel|mae\b|paypal|alipay|wechat/.test(n)) return "ewallet";
  if(/cash|tunai|purse|dompet/.test(n)) return "cash";
  if(/credit|card|visa|master|amex/.test(n)) return "card";
  if(/saving|asb|tabung|\bfd\b|fixed|kwsp|epf|emergency/.test(n)) return "savings";
  if(/invest|stock|share|crypto|unit trust|gold|versa|stash|moomoo|rakuten|luno/.test(n)) return "invest";
  return "bank"}
function colorFor(kind,i){return {ewallet:"#3D7BD9",cash:"#5B8C4A",card:"#8A6FD1",savings:"#F0A43A",invest:"#2E9E8F"}[kind]||["#E0635A","#D86FA5","#5A6478","#2E9E8F","#3D7BD9"][i%5]}
function balances(){
  const b={}; wallets().forEach(w=>b[w.id]=+w.open||0);
  for(const k in S.months) for(const x of S.months[k]){
    const w=wOf(x); if(!(w in b)) b[w]=0;
    if(x.t==="e") b[w]-=x.a; else if(x.t==="i") b[w]+=x.a; else if(x.t==="a") b[w]+=x.a;
    else if(x.t==="x"){ b[w]-=x.a; if(x.to){ if(!(x.to in b)) b[x.to]=0; b[x.to]+=x.a } }
  }
  return b;
}
function txCountForWallet(id){let n=0;for(const k in S.months) for(const x of S.months[k]) if(wOf(x)===id||x.to===id) n++;return n}

/* ---------- categories ---------- */
function iconFor(t,c){
  const own=(S.settings.cats&&S.settings.cats[t]||[]).find(x=>x.n===c); if(own) return own.ic;
  const d=(DEF[t]||[]).find(x=>x[0].toLowerCase()===String(c).toLowerCase()); if(d) return d[1];
  for(const k in S.months){const f=S.months[k].find(x=>x.t===t&&x.c===c&&x.ic); if(f) return f.ic}
  return t==="i"?"💰":"🏷️";
}
function catList(t){
  const count={}, icons={}; const hidden=new Set((S.settings.hidden&&S.settings.hidden[t])||[]);
  for(const k in S.months) for(const x of S.months[k]) if(x.t===t){count[x.c]=(count[x.c]||0)+1; if(x.ic&&!icons[x.c]) icons[x.c]=x.ic}
  const out=[], seen=new Set();
  const own=S.settings.cats&&S.settings.cats[t];
  if(own){ own.forEach(x=>{ if(!seen.has(x.n)){seen.add(x.n); out.push([x.n,x.ic])} }) }
  const used=Object.keys(count).sort((a,b)=>count[b]-count[a]);
  for(const n of used) if(!seen.has(n)&&!hidden.has(n)){seen.add(n); out.push([n,icons[n]||iconFor(t,n)])}
  if(!own) for(const [n,ic] of DEF[t]) if(!seen.has(n)&&!hidden.has(n)){seen.add(n); out.push([n,ic])}
  if(!out.length) out.push(["Other","✨"]);
  return out;
}
function initCats(t){ S.settings.cats=S.settings.cats||{}; if(!S.settings.cats[t]) S.settings.cats[t]=catList(t).map(([n,ic])=>({n,ic})) }

/* ---------- storage ---------- */
function saveLocal(){ try{localStorage.setItem("duitjar.v1",JSON.stringify({months:S.months,settings:S.settings,goals:S.goals}))}catch(e){} }
function loadLocal(){ try{const j=JSON.parse(localStorage.getItem("duitjar.v1")||"null"); if(j){S.months=j.months||{}; S.settings=Object.assign(S.settings,j.settings||{}); S.goals=j.goals||[]}}catch(e){} applyPalette() }
function errMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded") return "Storage is full. Delete some old entries in Settings.";
  return "Couldn't save just now. Check your connection and try again.";
}
function queue(key,fn){
  pending[key]=(pending[key]||0)+1;
  chains[key]=(chains[key]||Promise.resolve()).then(fn).catch(async e=>{
    if(e&&e.code==="unavailable"){ await sleep(400+Math.random()*600); try{ await fn(); return }catch(e2){ e=e2 } }
    if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")&&DB){ goLocal(); return }
    toast(errMsg(e));
  }).finally(()=>{ pending[key]--; });
  return chains[key];
}
function goLocal(){
  if(UNSUB){ try{UNSUB()}catch(e){} UNSUB=null }
  DB=null; S.mode="local";
  let had=null; try{ had=JSON.parse(localStorage.getItem("duitjar.v1")||"null") }catch(e){}
  if(had&&had.months){ for(const k in had.months){ const ids=new Set((S.months[k]||[]).map(x=>x.id)); S.months[k]=(S.months[k]||[]).concat(had.months[k].filter(x=>!ids.has(x.id))) } }
  saveLocal(); render();
  toast("Your account can't save on this page, so entries are saved on this device instead.");
}
function persistMonth(mk){
  if(!DB){ saveLocal(); return Promise.resolve() }
  return queue("m-"+mk, async()=>{
    const tx=S.months[mk]||[]; const ref=DB.doc(BASE+"/m-"+mk);
    if(!tx.length) await ref.delete(); else await ref.set({tx});
  });
}
function persistSettings(){
  if(!DB){ saveLocal(); return Promise.resolve() }
  return queue("settings", ()=>DB.doc(BASE+"/settings").set(JSON.parse(JSON.stringify(S.settings))));
}
async function getClaude(){ return null }

async function init(){
  renderBuddyShell(); render(); buddyIdle();
  let c=null, db=null, id=null;
  try{
    c=await getClaude();
    if(c){
      const [d,u,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")]);
      db=d; DL=dl;
      if(u){ id=await u.id(); let w=null; try{ w=await u.can("data.write") }catch(e){} if(w===false) db=null }
    }
  }catch(e){}
  if(db&&id){
    DB=db; BASE="data/users/"+id;
    UNSUB=DB.collection(BASE).onSnapshot(snap=>{
      const next={};
      snap.docs.forEach(d=>{
        const v=d.data()||{};
        if(d.id.startsWith("m-")) next[d.id.slice(2)]=Array.isArray(v.tx)?v.tx.map(x=>Object.assign({},x)):[];
        else if(d.id==="settings" && !pending["settings"]) S.settings=Object.assign({cur:"RM",budget:0},JSON.parse(JSON.stringify(v)));
        else if(d.id==="goals" && !pending["goals"]) S.goals=Array.isArray(v.list)?JSON.parse(JSON.stringify(v.list)):[];
      });
      for(const k in S.months) if(pending["m-"+k]) next[k]=S.months[k];
      S.months=next; S.mode="cloud"; applyPalette(); render(); const tp=topSheet(); if(tp==="ST"||tp==="CD") draw();
      if(firstLoad){ firstLoad=false; renderBuddyShell(); buddyIdle() }
    },e=>{ goLocal() });
  }else{
    S.mode="local"; loadLocal(); render(); renderBuddyShell(); buddyIdle();
  }
}

/* ---------- data helpers ---------- */
function inFilter(x){return !S.wf||wOf(x)===S.wf||x.to===S.wf}
function monthTx(ym){return (S.months[ym]||[]).filter(inFilter).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0))}
function totals(ym){let e=0,i=0;for(const x of S.months[ym]||[]){if(x.t==="e")e+=x.a;else if(x.t==="i")i+=x.a}return {e,i}}
function findTx(id){for(const k in S.months){const x=S.months[k].find(t=>t.id===id); if(x) return {k,x}}return null}

  const cid=style?"jcs":"jc";
  return '<svg class="jar'+(over?' over':'')+'"'+(style?' style="'+style+'"':'')+' viewBox="0 0 80 100" role="img" aria-label="Coin jar '+Math.round(Math.max(0,Math.min(1,ratio))*100)+'% full">'+
    '<defs><clipPath id="'+cid+'"><rect x="10" y="24" width="60" height="72" rx="17"/></clipPath></defs>'+
    '<rect class="glass" x="8.5" y="22.5" width="63" height="75" rx="19"/>'+
    '<g clip-path="url(#'+cid+')"><rect class="liquid" x="0" y="'+y.toFixed(1)+'" width="80" height="'+(fillH+4).toFixed(1)+'"/>'+coins+'</g>'+
    '<path class="shine" d="M18 40 v18"/>'+
    '<rect class="lid-edge" x="15" y="12" width="50" height="12" rx="5"/><rect class="lid" x="15" y="8" width="50" height="12" rx="5"/>'+
    '<rect class="slot" x="32" y="12" width="16" height="3" rx="1.5"/></svg>';

function dayLabel(d){
  const t=today(); const y=new Date(); y.setDate(y.getDate()-1);
  if(d===t) return "Today"; if(d===ymd(y)) return "Yesterday";
  const [Y,M,D]=d.split("-").map(Number); return new Date(Y,M-1,D).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
function txRow(x){

  let bub, title, sub, amt;
  if(x.t==="x"){ const to=wallet(x.to); bub='<span class="bubble neu" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h14l-3-3M20 16H6l3 3"/></svg></span>'; title=esc(w.name)+' → '+esc(to.name); sub=x.n?esc(x.n):'Transfer'; amt='<span class="amt num neu">'+money(x.a)+'</span>' }
  else if(x.t==="a"){ bub='<span class="bubble neu" aria-hidden="true">⚖️</span>'; title='Balance adjustment'; sub=[multi?w.name:"",x.n].filter(Boolean).map(esc).join(" · "); amt='<span class="amt num neu">'+(x.a<0?"−":"+")+money(Math.abs(x.a))+'</span>' }
  else { bub='<span class="bubble'+(x.t==="i"?" inc":"")+'" aria-hidden="true">'+esc(x.ic||iconFor(x.t,x.c))+'</span>'; title=esc(x.c); sub=[multi?w.name:"",x.n].filter(Boolean).map(esc).join(" · "); amt='<span class="amt num '+(x.t==="i"?"inc":"")+'">'+(x.t==="i"?"+":"−")+money(x.a)+'</span>' }

function renderDaily(list){
  const groups={}; list.forEach(x=>{(groups[x.d]=groups[x.d]||[]).push(x)});
  return Object.keys(groups).sort().reverse().map(d=>{
    const g=groups[d]; const net=g.reduce((s,x)=>s+(x.t==="e"?-x.a:x.t==="i"?x.a:0),0);
    return '<section><div class="day-head"><span>'+esc(dayLabel(d))+'</span><span class="num">'+(net?((net<0?'−':'+')+' '+money(Math.abs(net))):'')+'</span></div><div class="day-card">'+g.map(txRow).join("")+'</div></section>';
  }).join('<div class="gap"></div>');
}
function renderCats(list){
  const blocks=[];
  for(const t of ["e","i"]){
    const sums={}; let tot=0; list.filter(x=>x.t===t).forEach(x=>{sums[x.c]=(sums[x.c]||0)+x.a; tot+=x.a});
    const keys=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]); if(!keys.length) continue;
    const max=sums[keys[0]];
    blocks.push('<section class="panel"><h3>'+(t==="e"?"Where it went":"Where it came from")+' <span class="num" style="color:var(--muted);font-weight:600">· '+esc(cur())+' '+money(tot)+'</span></h3>'+
      keys.map(k=>'<button class="catrow" data-catd="'+esc(k)+'" data-catt="'+t+'" data-scope="month"><span class="bubble'+(t==="i"?" inc":"")+'" aria-hidden="true">'+esc(iconFor(t,k))+'</span><div style="min-width:0"><div class="meta"><span>'+esc(k)+'</span><span class="num">'+Math.round(sums[k]/tot*100)+'%</span></div><div class="bar'+(t==="i"?" inc":"")+'"><i style="width:'+(sums[k]/max*100).toFixed(1)+'%"></i></div></div><span class="amt num">'+money(sums[k])+'</span></button>').join("")+'</section>');
    if(t==="e") blocks.push(dailyChart(list));
  }
  if(!blocks.length) return '<div class="empty"><p>Only transfers this month, so there’s nothing to break down.</p></div>';
  return blocks.join('<div class="gap"></div>');
}
function dailyChart(list){
  const [y,m]=S.view.split("-").map(Number); const n=new Date(y,m,0).getDate(); const per=new Array(n).fill(0);
  list.forEach(x=>{if(x.t==="e") per[+x.d.slice(8)-1]+=x.a});
  const max=Math.max(...per,1); const W=320,H=110,L=4,B=18,T=16; const bw=(W-L*2)/n;
  const td=ymOf(new Date())===S.view?new Date().getDate():-1;
  let bars=""; per.forEach((v,ix)=>{const hh=v?Math.max(3,(v/max)*(H-B-T)):0; bars+='<rect class="col'+(ix+1===td?' today':'')+'" x="'+(L+ix*bw+1).toFixed(1)+'" y="'+(H-B-hh).toFixed(1)+'" width="'+Math.max(2,bw-2).toFixed(1)+'" height="'+hh.toFixed(1)+'" rx="2"><title>'+(ix+1)+': '+money(v)+'</title></rect>'});
  const peak=per.indexOf(max);
  return '<section class="panel chart"><h3>Spending by day</h3><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Daily spending bar chart">'+
    '<line class="grid" x1="'+L+'" x2="'+(W-L)+'" y1="'+T+'" y2="'+T+'"/>'+bars+
    '<text class="axis" x="'+L+'" y="10">Peak '+esc(cur())+' '+money(max)+' on day '+(peak+1)+'</text>'+
    '<text class="axis" x="'+L+'" y="'+(H-4)+'">1</text><text class="axis" x="'+(W/2)+'" y="'+(H-4)+'" text-anchor="middle">'+Math.ceil(n/2)+'</text><text class="axis" x="'+(W-L)+'" y="'+(H-4)+'" text-anchor="end">'+n+'</text></svg></section>';
}
function render(){
  const goals=S.page==="goals";
  $("homePage").hidden=goals; $("goalsPage").hidden=!goals;
  $("navHome").setAttribute("aria-current",goals?"false":"page"); $("navGoals").setAttribute("aria-current",goals?"page":"false");
  $("monthNav").style.visibility=goals?"hidden":"";
  $("monthLabel").textContent=S.tab==="year"?yearOf(S.view):monthName(S.view);
  $("addLabel").textContent=goals?"Goal":"Add";
  if(goals){ renderGoals(); return }
  renderHero(); renderWallets();
  $("tabDaily").setAttribute("aria-selected",S.tab==="daily"); $("tabCats").setAttribute("aria-selected",S.tab==="cats"); $("tabYear").setAttribute("aria-selected",S.tab==="year");
  const main=$("main"); const list=monthTx(S.view);
  if(S.mode==="loading"){ main.innerHTML=""; return }
  if(S.tab==="year"){ main.innerHTML=renderYear(); return }
  if(!list.length){
    const any=Object.keys(S.months).some(k=>S.months[k].length);
    main.innerHTML='<div class="empty">'+jarSVG(0,false,"width:60px")+
      '<h2>'+(any?'Nothing here in '+esc(monthName(S.view).split(" ")[0]):'Your jar is empty')+'</h2><p>'+(any?(S.wf?'No entries for this wallet this month.':'No spending or income recorded this month yet.'):'Add today’s first expense, or bring over your history from Money Manager.')+'</p>'+
      '<div class="row-btns"><button class="btn primary" data-act="add">Add entry</button>'+(any?'':'<button class="btn soft" data-act="import">Import from Money Manager</button>')+'</div></div>';
    return;
  }
  main.innerHTML=S.tab==="daily"?renderDaily(list):renderCats(list);
}

/* entry editor */
function openEditor(id){
  const f=id&&findTx(id); const ws=wallets();
  if(f){ const x=f.x; ED={id:x.id,t:x.t,amt:String(Math.abs(x.a)),sign:x.a<0?-1:1,c:x.c,ic:x.ic||iconFor(x.t,x.c),n:x.n||"",d:x.d,w:wOf(x),to:x.to||null,confirm:false} }
  else {
    const first=catList("e")[0]; let w=S.wf||S.settings.lastW||ws[0].id; if(!ws.some(z=>z.id===w)) w=ws[0].id;
    const w2=(ws.find(z=>z.id!==w)||{}).id||null;
    ED={id:null,t:"e",amt:"",sign:1,c:first[0],ic:first[1],n:"",d:S.view===ymOf(new Date())?today():S.view+"-01",w,to:w2,confirm:false}
  }
  draw();
}
function wChips(role,sel,exclude){

function drawEditor(){

   '<div class="amount-display num'+(amtNum?'':' zero')+'"><small>'+esc(cur())+'</small>'+(isA&&ED.sign<0?'−':'')+esc(ED.amt||"0")+'</div>';
  if(!isX&&!isA){
    body+='<div class="cats">'+catList(ED.t).map(([n,ic])=>'<button class="cat" aria-pressed="'+(ED.c===n)+'" data-cat="'+esc(n)+'" data-ic="'+esc(ic)+'"><em aria-hidden="true">'+esc(ic)+'</em><span>'+esc(n)+'</span></button>').join("")+

  body+='<div class="fields"><input class="field" id="noteIn" placeholder="Note (optional)" maxlength="80" value="'+esc(ED.n)+'"><input class="field" id="dateIn" type="date" value="'+esc(ED.d)+'" aria-label="Date"></div>'+
   '<div class="keypad">'+["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(k=>'<button data-key="'+k+'" aria-label="'+(k==="⌫"?"Delete digit":k)+'">'+k+'</button>').join("")+'</div>'+
   '<button class="save" id="saveBtn"'+(canSave()?'':' disabled')+'>'+(ED.id?"Save changes":"Save "+({e:"expense",i:"income",x:"transfer",a:"adjustment"}[ED.t]))+'</button>'+

function canSave(){ const v=parseFloat(ED.amt||"0"); if(!(v>0)) return false; if(ED.t==="x") return !!ED.to&&ED.to!==ED.w; return true }
function syncFields(){ const n=$("noteIn"), d=$("dateIn"); if(ED){ if(n) ED.n=n.value; if(d&&d.value) ED.d=d.value } }
function updateAmt(){ const el=document.querySelector(".amount-display"); if(!el) return; const v=parseFloat(ED.amt||"0");
  el.innerHTML='<small>'+esc(cur())+'</small>'+(ED.t==="a"&&ED.sign<0?'−':'')+esc(ED.amt||"0"); el.classList.toggle("zero",!v); $("saveBtn").disabled=!canSave() }
function pressKey(k){
  let a=ED.amt;
  if(k==="⌫") a=a.slice(0,-1);
  else if(k==="."){ if(!a.includes(".")) a=(a||"0")+"." }
  else { if(a.includes(".")&&a.split(".")[1].length>=2) return; if(a.replace(".","").length>=9) return; a=(a==="0"?"":a)+k }
  ED.amt=a; updateAmt();
}
function saveEntry(){
  syncFields(); if(!canSave()) return;
  const a=Math.round(parseFloat(ED.amt)*100)/100;
  const mk=ED.d.slice(0,7); const touched=new Set([mk]);
  let rec=null;
  if(ED.id){ const f=findTx(ED.id); if(f){ S.months[f.k]=S.months[f.k].filter(x=>x.id!==ED.id); touched.add(f.k); rec=Object.assign({},f.x) } }
  rec=rec||{id:uid(),ts:Date.now()};
  rec.t=ED.t; rec.d=ED.d; rec.n=ED.n.trim(); rec.w=ED.w;
  if(ED.t==="x"){ rec.a=a; rec.to=ED.to; rec.c="Transfer"; delete rec.ic }
  else if(ED.t==="a"){ rec.a=a*ED.sign; rec.c="Balance adjustment"; delete rec.to }
  else { rec.a=a; rec.c=ED.c; rec.ic=ED.ic; delete rec.to }
  (S.months[mk]=S.months[mk]||[]).push(rec);
  touched.forEach(k=>persistMonth(k));
  let st=ensureWallets(); if(S.settings.lastW!==ED.w){ S.settings.lastW=ED.w; st=true } if(st) persistSettings();
  const wasNew=!ED.id, typ=ED.t; closeAll(); S.view=mk; render();
  toast(wasNew?({e:"Expense saved",i:"Income saved",x:"Transfer saved",a:"Saved"}[typ]):"Changes saved");
  if(wasNew) reactSave(typ,rec);
}
function deleteEntry(){ const f=findTx(ED.id); if(f){ S.months[f.k]=S.months[f.k].filter(x=>x.id!==ED.id); persistMonth(f.k) } closeAll(); render(); toast("Entry deleted") }

/* ---------- import ---------- */
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res();s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)});
}
async function readFile(file){
  await loadXLSX();
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  let best=null;
  for(const name of wb.SheetNames){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""}); if(!best||rows.length>best.length) best=rows }
  return best||[];
}
function num(v){ if(typeof v==="number") return v; let s=String(v||"").trim(); const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s); s=s.replace(/[^0-9.]/g,""); const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n) }
function parseDate(v,order){
  if(v instanceof Date&&!isNaN(v)) return ymd(v);
  if(typeof v==="number"&&v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()) }
  const s=String(v||"").trim(); if(!s) return null; let m;
  if((m=s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/))) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; const D=order==="mdy"?+m[2]:+m[1], M=order==="mdy"?+m[1]:+m[2]; if(M<1||M>12||D<1||D>31) return null; return y+"-"+pad(M)+"-"+pad(D) }
  const t=Date.parse(s); return isNaN(t)?null:ymd(new Date(t));
}
function parseRows(rows,order){
  let hi=-1, H=null;
  for(let r=0;r<Math.min(rows.length,25);r++){
    const cells=rows[r].map(c=>String(c).trim().toLowerCase());
    if(cells.some(c=>/^(period|date|time|tarikh)/.test(c)) && cells.some(c=>/amount|^[a-z]{3}$|^rm$|jumlah/.test(c))){hi=r;H=cells;break}
  }
  if(hi<0) throw new Error("I couldn't find Date and Amount columns in this file. Use the Excel export from Money Manager, or a CSV with those columns.");
  const col=re=>H.findIndex(c=>re.test(c));
  const ci={ date:col(/^(period|date|time|tarikh)/), type:col(/income.*expense|^type$|in\/ex|^kind$|jenis/), cat:col(/^category|^kategori/), sub:col(/^sub.?category/),
    note:col(/^note|^nota/), desc:col(/^description|^memo|^keterangan/), acc:col(/^account|^akaun|^wallet|^asset/),
    home:H.findIndex(c=>(/^[a-z]{3}$/.test(c)&&!["cur","acc","sum"].includes(c))||c==="rm"), amt:col(/^amount|jumlah/) };
  const aCol=ci.home>=0?ci.home:ci.amt;
  if(aCol<0) throw new Error("I couldn't find an Amount column in this file.");
  let firstBig=false, secondBig=false, textDates=false;
  for(let r=hi+1;r<rows.length;r++){ const v=rows[r][ci.date]; if(typeof v==="string"){ const m=v.trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]\d{2,4}/); if(m){ textDates=true; if(+m[1]>12) firstBig=true; if(+m[2]>12) secondBig=true } } }
  let ambiguous=false;
  if(firstBig) order="dmy"; else if(secondBig) order="mdy"; else ambiguous=textDates;

  const existing=(S.settings.wallets&&S.settings.wallets.length)?S.settings.wallets:[]; const newW=[]; const byName={};
  existing.forEach(w=>{ byName[w.name.toLowerCase()]=w.id });
  function wid(name){
    const n=String(name||"").trim(); if(!n) return null;
    const k=n.toLowerCase(); if(byName[k]) return byName[k];
    const kind=guessKind(n); const id="w"+uid(); const w={id,name:n,kind,color:colorFor(kind,newW.length),open:0};
    newW.push(w); byName[k]=id; return id;
  }
  const out=[], skipped={bad:0}; const seenX=new Set();
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]; if(!row||row.every(c=>String(c).trim()==="")) continue;
    const typeRaw=ci.type>=0?String(row[ci.type]).toLowerCase().trim():"";
    const d=parseDate(row[ci.date],order); let a=num(row[aCol]);
    if((isNaN(a)||a===0)&&ci.amt>=0&&ci.amt!==aCol) a=num(row[ci.amt]);
    if(!d||isNaN(a)||a===0){skipped.bad++;continue}
    const accName=ci.acc>=0?row[ci.acc]:""; const catRaw=ci.cat>=0?String(row[ci.cat]).trim():"";
    const noteParts=[ci.sub>=0?splitEmoji(row[ci.sub]).name:"", ci.note>=0?String(row[ci.note]).trim():"", ci.desc>=0?String(row[ci.desc]).trim():""].filter(Boolean).filter((v,ix,arr)=>arr.indexOf(v)===ix);
    const note=noteParts.join(" · ").slice(0,120);
    const base={id:uid(),ts:Date.now(),d,n:note};
    if(/transfer|trans\b|pindah/.test(typeRaw)){
      const isIn=/(^|[^a-z])in\b|masuk/.test(typeRaw)&&!/out|keluar/.test(typeRaw);
      const here=wid(accName)||wid("Cash"); const otherName=splitEmoji(catRaw).name.replace(/^transfer.*$/i,"");
      const other=wid(otherName)||wid("Other account");
      const from=isIn?other:here, to=isIn?here:other; const amt=Math.abs(Math.round(a*100)/100);
      const key=d+"|"+amt+"|"+from+"|"+to;
      if(seenX.has(key)) continue; seenX.add(key);
      out.push(Object.assign(base,{t:"x",a:amt,c:"Transfer",w:from,to})); continue;
    }
    if(/modif|balance|bal\.|adjust/.test(typeRaw)){
      out.push(Object.assign(base,{t:"a",a:Math.round(a*100)/100,c:"Balance adjustment",w:wid(accName)||wid("Cash")})); continue;
    }
    let t;
    if(/exp|out|spend|belanja|debit|keluar/.test(typeRaw)) t="e";
    else if(/inc|earn|pendapatan|credit|masuk/.test(typeRaw)) t="i";
    else t=a<0?"e":(ci.type<0?"e":"e");
    const cs=splitEmoji(catRaw); const cname=cs.name||"Other";
    const rec=Object.assign(base,{t,a:Math.abs(Math.round(a*100)/100),c:cname,ic:cs.ic||iconFor(t,cname)});
    const w=wid(accName); if(w) rec.w=w;
    out.push(rec);
  }
  const used=new Set(); out.forEach(x=>{ if(x.w) used.add(x.w); if(x.to) used.add(x.to) });
  const nw=newW.filter(w=>used.has(w.id));
  const names=[...used].map(id=>(existing.find(w=>w.id===id)||nw.find(w=>w.id===id)||{}).name).filter(Boolean);
  return {tx:out,skipped,ambiguous,order,newWallets:nw,walletNames:names};
}
async function doImport(){
  const p=ST.parsed; if(!p) return;
  const key=x=>x.d+"|"+x.t+"|"+x.a+"|"+(x.t==="x"?"":x.c)+"|"+(x.n||"");
  if(p.newWallets.length){
    const hadOwn=!!(S.settings.wallets&&S.settings.wallets.length);
    S.settings.wallets=(hadOwn?S.settings.wallets:[]).concat(p.newWallets);
    persistSettings();
  }
  const by={}; p.tx.forEach(x=>{(by[x.d.slice(0,7)]=by[x.d.slice(0,7)]||[]).push(x)});
  let added=0, dup=0; const touched=new Set();
  for(const mk of Object.keys(by)){
    const cur=S.months[mk]||[]; const idx={}; cur.forEach(x=>{ (idx[key(x)]=idx[key(x)]||[]).push(x) });
    const fresh=[];
    by[mk].forEach(x=>{ const k=key(x); const m=idx[k]&&idx[k].shift();
      if(m){ dup++; if(!m.w&&x.w){ m.w=x.w; if(x.to) m.to=x.to; touched.add(mk) } }
      else fresh.push(x) });
    if(fresh.length){ added+=fresh.length; S.months[mk]=cur.concat(fresh); touched.add(mk) }
  }
  closeAll();
  const months=Object.keys(by).sort();
  if(months.length && !(S.months[S.view]||[]).length) S.view=months[months.length-1];
  S.wf=null; render(); toast("Importing "+added+" entries…");
  for(const mk of [...touched].sort()) await persistMonth(mk);
  toast("Imported "+added+" entries"+(dup?" ("+dup+" were already here)":""));
  if(added) setTimeout(()=>say("Wow, "+added+" entries! That's a lot of sniffing 🐾","happy",5000),900);
}
async function exportCSV(){
  const rows=[["Date","Type","Category","Wallet","To wallet","Note","Amount ("+cur()+")"]];
  Object.keys(S.months).sort().forEach(k=>S.months[k].slice().sort((a,b)=>a.d<b.d?-1:1).forEach(x=>rows.push([x.d,{e:"Expense",i:"Income",x:"Transfer",a:"Adjustment"}[x.t],x.t==="x"?"":x.c,wallet(wOf(x)).name,x.to?wallet(x.to).name:"",x.n||"",(x.t==="e"?-x.a:x.a).toFixed(2)])));
  const csv=rows.map(r=>r.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(",")).join("\n");
  const name="duit-jar-"+today()+".csv";
  if(DL){ try{ await DL.save({filename:name,data:csv}); toast("Backup saved"); return }catch(e){ if(e&&e.code==="declined") return } }
  try{ const blob=new Blob(["\ufeff"+csv],{type:"text/csv"}); const f=new File([blob],name,{type:"text/csv"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"Duit Jar backup"}); toast("Backup ready"); return }
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500); toast("Backup saved");
  }catch(e){ if(e&&e.name==="AbortError") return; try{ await navigator.clipboard.writeText(csv); toast("The CSV was copied instead") }catch(_){ toast("Export didn't work. Try again.") } }
}
async function wipeAll(){

function dogEl(){return document.querySelector("#dogWrap .dog")}
function say(text,mood,ms){
  const el=$("say"), d=dogEl(); if(!el||!d) return;
  el.innerHTML='<small>'+esc(dogName())+'</small>'+esc(text);

function streak(){
  const days=new Set(); for(const k in S.months) for(const x of S.months[k]) days.add(x.d);
  const d=new Date(); if(!days.has(ymd(d))) d.setDate(d.getDate()-1);
  let n=0; while(days.has(ymd(d))){ n++; d.setDate(d.getDate()-1) } return n;
}
function buddyIdle(){
  if(S.mode==="loading"){ say("Sniffing out your jar…"); return }
  const any=Object.keys(S.months).some(k=>S.months[k].length);
  if(S.page==="goals"){ say((S.goals||[]).length?"Every ringgit counts. I'm cheering for you!":"What are we saving for? A wedding? A house? Treats?"); return }
  if(!any){ say("Hi, I'm "+dogName()+"! Tap Add to log your first spend 🐾"); return }
  const h=new Date().getHours(); const hi=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const nToday=(S.months[ymOf(new Date())]||[]).filter(x=>x.d===today()).length;
  const st=streak(); const b=+S.settings.budget||0; const spent=totals(ymOf(new Date())).e;
  if(b>0&&spent>b){ say("We're over budget this month 🥺 Home-cooked dinner tonight?","sad"); return }
  let msg=nToday?(nToday+(nToday===1?" entry":" entries")+" today. Good human! 🦴"):(hi+"! Nothing logged today yet.");
  if(st>1) msg+=" "+(nToday?"That's a "+st+"-day streak!":"Keep our "+st+"-day streak going!");
  say(msg,"");
}

function reactSave(typ,rec){
  if(typ==="i"){ say("Yay, money in! Treat time? 🦴","happy",4500); return }
  if(typ==="x"){ say("Moved it! All paws tidy 🐾","happy",3500); return }
  if(typ!=="e") return;
  const b=+S.settings.budget||0; const sp=totals(rec.d.slice(0,7)).e;
  if(b>0&&sp>b&&sp-rec.a<=b){ say("Uh oh, that tipped us over budget 🥺","sad",5500); return }
  const c=String(rec.c).toLowerCase(); let line;
  if(/food|eat|lunch|dinner|breakfast|makan|meal/.test(c)) line="Smells yummy! Did you save me a bite? 🍖";
  else if(/drink|coffee|boba|tea|kopi/.test(c)) line="Ooh, a drink! Can I lick the cup?";
  else if(/grocer|market|mart/.test(c)) line="Anything for me in the bag? 🥕";
  else if(/transport|petrol|grab|car|fuel|toll|parking/.test(c)) line="Vroom! Can I stick my head out the window?";
  else if(/shop|cloth/.test(c)) line="Shopping again? I only need one squeaky toy 🧸";
  else if(/pet|dog|vet/.test(c)) line="Is that for ME?! 🐶💕";
  else line=["Logged! Woof 🐾","Got it, I'll guard the receipt.","Noted. Good human!","Into the jar it goes!"][Math.floor(Math.random()*4)];
  say(line,"happy",4000);
}

const MON=["J","F","M","A","M","J","J","A","S","O","N","D"];
function yearOf(ym){return ym.slice(0,4)}
function yearTx(y){const out=[];for(let m=1;m<=12;m++)(S.months[y+"-"+pad(m)]||[]).forEach(x=>{if(inFilter(x))out.push(x)});return out}
function yearMonths(y){const r=[];for(let m=1;m<=12;m++){const k=y+"-"+pad(m);let e=0,i=0;(S.months[k]||[]).forEach(x=>{if(!inFilter(x))return;if(x.t==="e")e+=x.a;else if(x.t==="i")i+=x.a});r.push({k,e,i})}return r}
function catRows(list,t,scope){
  const sums={}; let tot=0; list.filter(x=>x.t===t).forEach(x=>{sums[x.c]=(sums[x.c]||0)+x.a; tot+=x.a});
  const keys=Object.keys(sums).sort((a,b)=>sums[b]-sums[a]); if(!keys.length) return "";
  const max=sums[keys[0]];
  return keys.map(k=>'<button class="catrow" data-catd="'+esc(k)+'" data-catt="'+t+'" data-scope="'+scope+'"><span class="bubble'+(t==="i"?" inc":"")+'" aria-hidden="true">'+esc(iconFor(t,k))+'</span><div style="min-width:0"><div class="meta"><span>'+esc(k)+'</span><span class="num">'+Math.round(sums[k]/tot*100)+'%</span></div><div class="bar'+(t==="i"?" inc":"")+'"><i style="width:'+(sums[k]/max*100).toFixed(1)+'%"></i></div></div><span class="amt num">'+money(sums[k])+'</span></button>').join("");
}
function stat(label,v,cls,sub){return '<div class="stat"><div class="label">'+esc(label)+'</div><div class="v num '+cls+'"><small>'+esc(cur())+'</small> '+money(v)+'</div>'+(sub?'<div class="hint">'+esc(sub)+'</div>':'')+'</div>'}

  h+='<section class="panel chart"><div class="ph"><h3>Month by month</h3><div class="legend"><span><i class="le"></i>Spent</span><span><i class="li"></i>Earned</span></div></div><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending and income each month of '+y+'"><line class="grid" x1="'+L+'" x2="'+(W-L)+'" y1="'+T+'" y2="'+T+'"/><text class="axis" x="'+L+'" y="12">'+esc(cur())+' '+money(mx)+'</text>'+bars+'</svg>'+
    (top.e?'<p class="hint">Biggest spending month: <b>'+esc(monthName(top.k))+'</b>, '+esc(cur())+' '+money(top.e)+'</p>':'')+'</section>';
  const yt=yearTx(y); const ce=catRows(yt,"e","year"), ci=catRows(yt,"i","year");
  if(ce) h+='<div class="gap"></div><section class="panel"><h3>Where it went in '+y+'</h3>'+ce+'</section>';

function monthsLeft(g){ if(!g.date) return null; const [y,m]=g.date.split("-").map(Number); const n=new Date(); return (y-n.getFullYear())*12+(m-(n.getMonth()+1))+1 }
function goalLine(g,saved){

  const body='<div class="preview-cat"><span class="gic big" aria-hidden="true">'+esc(GE.ic)+'</span><input class="field" id="gName" maxlength="28" placeholder="e.g. Our wedding" value="'+esc(GE.name)+'"></div>'+
   '<div class="label">Icon</div><div class="emoji-grid">'+GOAL_IC.map(em=>'<button data-gemoji="'+esc(em)+'" aria-pressed="'+(GE.ic===em)+'" aria-label="'+esc(em)+'">'+esc(em)+'</button>').join("")+'</div>'+
   '<div class="label">Target amount</div><div class="inline"><b>'+esc(cur())+'</b><input class="field num" id="gTarget" inputmode="decimal" placeholder="30000" value="'+esc(GE.target)+'"></div>'+
   '<div class="label">Target month (optional)</div><input class="field" id="gDate" type="month" value="'+esc(GE.date)+'">'+
   '<div class="label">How to track it</div><div class="seg"><button data-gmode="m" aria-pressed="'+(GE.mode==="m")+'">Add money myself</button><button data-gmode="w" aria-pressed="'+(GE.mode==="w")+'">Use a wallet</button></div>'+
   (GE.mode==="w"?'<p class="hint">The goal follows this wallet’s balance. Handy for a separate savings account.</p><div class="wrow">'+wallets().map(w=>'<button class="wchip" data-gw="'+esc(w.id)+'" aria-pressed="'+(GE.w===w.id)+'">'+wIcon(w,true)+esc(w.name)+'</button>').join("")+'<button class="wchip" data-addwallet="1"><span class="wicon sm" style="--wc:var(--muted)" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>New wallet</button></div>':'<p class="hint">Tap “Add money” on the goal whenever you put some aside.</p>')+
   '<button class="save" id="gSave">'+(GE.id?"Save goal":"Create goal")+'</button>';
  keepScroll(()=>{ $("sheetRoot").innerHTML=shell(GE.id?"Edit goal":"New goal",body,GD?"Back":null) });
}
function syncGoal(){ if(!GE) return; const a=$("gName"),b=$("gTarget"),c=$("gDate"); if(a) GE.name=a.value; if(b) GE.target=b.value; if(c) GE.date=c.value }
function saveGoal(){
  syncGoal(); const name=GE.name.trim(); const target=Math.round((parseFloat(String(GE.target).replace(/[^0-9.]/g,""))||0)*100)/100;
  if(!name){ toast("Give the goal a name"); return } if(!(target>0)){ toast("Set a target amount"); return }
  if(GE.mode==="w"&&!GE.w){ toast("Pick the wallet to follow"); return }
  const data={name,ic:GE.ic,target,date:/^\d{4}-\d{2}$/.test(GE.date)?GE.date:""};
  if(GE.mode==="w") data.w=GE.w;
  if(GE.id){ const g=S.goals.find(x=>x.id===GE.id); if(g){ Object.assign(g,data); if(GE.mode!=="w") delete g.w } }
  else S.goals=(S.goals||[]).concat([Object.assign({id:"g"+uid(),adds:[]},data)]);
  persistGoals(); const wasNew=!GE.id; GE=null; draw(); render();
  toast(wasNew?"Goal created":"Goal saved"); if(wasNew) say("A new goal! Let's fill it up together 💪","happy",4500);
}
function openGoalDetail(id){ GD={id,confirm:false,del:null}; draw() }
function drawGoalDetail(){
  const g=(S.goals||[]).find(x=>x.id===GD.id); if(!g){ GD=null; draw(); return }
  const s=goalSaved(g), p=g.target?s/g.target:0, ml=monthsLeft(g), left=Math.max(0,g.target-s);
  let body='<div class="gd-top"><div class="ringwrap">'+ring(p,132)+'<span class="ring-in"><span class="gic" aria-hidden="true">'+esc(g.ic||"💰")+'</span><b class="num">'+Math.floor(Math.min(1,p)*100)+'%</b></span></div>'+
   '<div class="big num"><small>'+esc(cur())+'</small>'+money(s)+'</div><p class="hint">saved of '+esc(cur())+' '+money(g.target)+'</p></div>'+
   '<div class="stats">'+mini("Still to go",cur()+" "+money(left))+mini("Months left",ml==null?"No date":(ml>0?String(ml):"Passed"))+mini("Needed a month",(ml&&ml>0&&left>0)?cur()+" "+money(left/ml):"—")+mini("Target month",g.date?monthName(g.date):"Anytime")+'</div>';
  if(g.w){
    body+='<p class="hint">This goal follows the balance of <b>'+esc(wallet(g.w).name)+'</b>. Move money into that wallet to grow it.</p><button class="btn primary" data-gtransfer="1">Transfer into '+esc(wallet(g.w).name)+'</button>';
  } else {
    body+='<div class="label">Add or take out money</div><div class="fields"><input class="field num" id="gAmt" inputmode="decimal" placeholder="Amount"><input class="field" id="gNote" placeholder="Note" maxlength="40" style="max-width:140px"></div>'+
     '<div class="row-btns"><button class="btn soft" data-gadd="-1" style="flex:1">Take out</button><button class="btn primary" data-gadd="1" style="flex:2">Add money</button></div>';
    const adds=(g.adds||[]).slice().sort((a,b)=>a.d<b.d?1:-1);
    if(adds.length) body+='<div class="label">History</div><div class="day-card flat">'+adds.map(a=>'<div class="tx gadd"><span class="bubble'+(a.a<0?"":" inc")+'" aria-hidden="true">'+(a.a<0?"↩️":"🪙")+'</span><span class="tx-main"><div class="tx-cat">'+esc(a.n||(a.a<0?"Taken out":"Added"))+'</div><div class="tx-note">'+esc(fmtD(a.d))+'</div></span><span class="gright"><span class="amt num'+(a.a<0?"":" inc")+'">'+(a.a<0?"−":"+")+money(Math.abs(a.a))+'</span>'+(GD.del===a.id?'<button class="mini danger-t" data-gdelyes="'+esc(a.id)+'">Remove</button>':'<button class="mini" data-gdel="'+esc(a.id)+'" aria-label="Remove this entry">✕</button>')+'</span></div>').join("")+'</div>';
  }
  body+='<div class="row-btns"><button class="btn soft" data-gedit="1">Edit goal</button>'+(GD.confirm?'':'<button class="btn danger" data-gremove="1">Delete goal</button>')+'</div>'+
    (GD.confirm?'<div class="confirm"><span>Delete this goal and its history?</span><span class="row-btns"><button class="btn soft" data-gremoveno="1">Keep</button><button class="btn danger" data-gremoveyes="1">Delete</button></span></div>':'');
  keepScroll(()=>{ $("sheetRoot").innerHTML=shell(g.name,body) });
}
function addToGoal(sign){
  const g=S.goals.find(x=>x.id===GD.id); if(!g) return;
  const a=Math.round((parseFloat(($("gAmt").value||"").replace(/[^0-9.]/g,""))||0)*100)/100; if(!(a>0)){ toast("Enter an amount"); return }
  const before=goalSaved(g); g.adds=(g.adds||[]).concat([{id:uid(),d:today(),a:a*sign,n:($("gNote").value||"").trim()}]);
  persistGoals(); const after=goalSaved(g); draw(); render();
  toast(sign>0?"Added to "+g.name:"Taken out of "+g.name);
  if(before<g.target&&after>=g.target){ confetti(); say("We did it! "+g.name+" is fully funded! 🎉","happy",7000) }
  else if(sign>0) say(["Into the goal jar! 🐾","Closer every day!","Woof! "+Math.floor(after/g.target*100)+"% there!"][Math.floor(Math.random()*3)],"happy",3500);
}
function topSheet(){return CE?"CE":WE?"WE":ED?"ED":GE?"GE":GD?"GD":SR?"SR":CD?"CD":ST?"ST":null}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close],label"); if(!t) return;
  if(t.classList.contains("scrim")&&e.target!==t) return;
  const ds=t.dataset;
  if(t.id==="prevM"){S.view=shiftMonth(S.view,S.tab==="year"?-12:-1);render();return}
  if(t.id==="nextM"){S.view=shiftMonth(S.view,S.tab==="year"?12:1);render();return}
  if(t.id==="tabDaily"){S.tab="daily";render();return}
  if(t.id==="tabCats"){S.tab="cats";render();return}
  if(t.id==="tabYear"){S.tab="year";render();return}
  if(t.id==="openSearch"){openSearch();return}
  if(t.id==="navHome"){S.page="home";window.scrollTo(0,0);render();buddyIdle();return}
  if(t.id==="navGoals"){S.page="goals";window.scrollTo(0,0);render();buddyIdle();return}
  if(t.id==="dogBtn"){petDog();return}
  if(t.id==="addBtn"){ if(S.page==="goals") openGoal(null); else openEditor(); return }
  if(ds.act==="add"){openEditor();return}
  if(t.id==="openSettings"){openSettings();return}
  if(ds.act==="budget"){openSettings("budget");return}
  if(ds.act==="import"){openSettings("import");return}
  if("wf" in ds && !t.closest(".sheet")){S.wf=ds.wf||null;render();return}
  if(ds.gomonth){S.view=ds.gomonth;S.tab="daily";render();window.scrollTo(0,0);return}
  if("catd" in ds){openCatDetail(ds.catt,ds.catd,ds.scope);return}
  if(ds.goal){openGoalDetail(ds.goal);return}
  if("newgoal" in ds){openGoal(null,ds.newgoal,ds.gic);return}
  if(ds.edit){openEditor(ds.edit);return}
  if(ds.close){ closeAll(); return }
  if(ds.back){ if(CE){CE=null} else if(WE){WE=null} else if(GE){GE=null} draw(); return }
  if(ds.addwallet){ syncFields(); syncGoal(); openWallet(null); return }
  if(ds.editwallet){ openWallet(ds.editwallet); return }

  if(CE){
    if(ds.emoji){syncCat();CE.ic=ds.emoji;drawCat();return}
    if(ds.cet){syncCat();CE.t=ds.cet;drawCat();return}
    if(t.id==="catSave"){saveCat();return}
    if(ds.cdel){syncCat();CE.confirm=true;drawCat();return}
    if(ds.cdelno){syncCat();CE.confirm=false;drawCat();return}
    if(ds.cdelyes){removeCat();return}
    return;
  }
  if(WE){
    if(ds.kind){syncWallet();WE.kind=ds.kind;drawWallet();return}
    if(ds.wcolor){syncWallet();WE.color=ds.wcolor;drawWallet();return}
    if(t.id==="wSave"){saveWallet();return}
    if(ds.wdel){syncWallet();WE.confirm=true;drawWallet();return}
    if(ds.wdelno){syncWallet();WE.confirm=false;drawWallet();return}
    if(ds.wdelyes){deleteWallet();return}
    return;
  }
  if(ED){
    if(ds.type){syncFields(); if(ED.t==="a") ED.sign=1; ED.t=ds.type; if(ED.t!=="x"){const f=catList(ED.t)[0];ED.c=f[0];ED.ic=f[1]} else if(!ED.to||ED.to===ED.w){ED.to=(wallets().find(w=>w.id!==ED.w)||{}).id||null} drawEditor();return}
    if(ds.cat){syncFields();ED.c=ds.cat;ED.ic=ds.ic;drawEditor();return}
    if(ds.newcat){syncFields();openCat(ED.t,null);return}
    if(ds.pickw){syncFields(); if(ds.role==="to") ED.to=ds.pickw; else { ED.w=ds.pickw; if(ED.to===ED.w) ED.to=(wallets().find(w=>w.id!==ED.w)||{}).id||null } drawEditor();return}
    if(ds.key){pressKey(ds.key);return}
    if(t.id==="saveBtn"){saveEntry();return}
    if(ds.del){syncFields();ED.confirm=true;drawEditor();return}
    if(ds.delno){syncFields();ED.confirm=false;drawEditor();return}
    if(ds.delyes){deleteEntry();return}
    return;
  }
  if(GE){
    if(ds.gemoji){syncGoal();GE.ic=ds.gemoji;drawGoalEditor();return}
    if(ds.gmode){syncGoal();GE.mode=ds.gmode;drawGoalEditor();return}
    if(ds.gw){syncGoal();GE.w=ds.gw;drawGoalEditor();return}
    if(t.id==="gSave"){saveGoal();return}
    return;
  }
  if(GD){
    if(ds.gadd){addToGoal(+ds.gadd);return}
    if(ds.gdel){GD.del=ds.gdel;drawGoalDetail();return}
    if(ds.gdelyes){const g=S.goals.find(x=>x.id===GD.id); if(g){g.adds=(g.adds||[]).filter(a=>a.id!==ds.gdelyes); persistGoals()} GD.del=null; draw(); render(); return}
    if(ds.gedit){openGoal(GD.id);return}
    if(ds.gremove){GD.confirm=true;drawGoalDetail();return}
    if(ds.gremoveno){GD.confirm=false;drawGoalDetail();return}
    if(ds.gremoveyes){S.goals=S.goals.filter(x=>x.id!==GD.id); persistGoals(); closeAll(); render(); toast("Goal deleted"); return}
    if(ds.gtransfer){const g=S.goals.find(x=>x.id===GD.id); openEditor(null); ED.t="x"; ED.to=g.w; if(ED.w===g.w) ED.w=(wallets().find(w=>w.id!==g.w)||{}).id||ED.w; draw(); return}
    return;
  }
  if(SR){
    if(ds.st){const i=$("searchIn"); if(i) SR.q=i.value; SR.t=ds.st; drawSearch(); return}
    return;
  }
  if(CD){
    if(ds.editcd){openCat(CD.t,CD.c);return}
    return;
  }
  if(ST){
    if(ds.pal){S.settings.palette=ds.pal;applyPalette();persistSettings();drawSettings();return}
    if(ds.ct){ST.ct=ds.ct;drawSettings();return}
    if(ds.editcat){openCat(ST.ct,ds.editcat);return}
    if(ds.newcat){openCat(ST.ct,null);return}
    if(ds.swap){ST.order=ST.order==="dmy"?"mdy":"dmy";try{ST.parsed=parseRows(ST.rows,ST.order);ST.parsed.ambiguous=true}catch(err){} drawSettings();return}
    if(ds.doimport){doImport();return}
    if(ds.export){exportCSV();return}
    if(ds.wipe){ST.wipe=true;drawSettings();return}
    if(ds.wipeno){ST.wipe=false;drawSettings();return}
    if(ds.wipeyes){wipeAll();return}
  }
});
document.addEventListener("change",async e=>{
  if(e.target.id==="fileIn"&&ST){
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    ST.file=f.name; ST.busy=true; ST.error=null; ST.parsed=null; drawSettings();
    try{ ST.rows=await readFile(f); ST.parsed=parseRows(ST.rows,ST.order); ST.order=ST.parsed.order }
    catch(err){ ST.error=err&&err.message&&!/^load$/.test(err.message)?err.message:"That file couldn't be read. Try the Excel export from Money Manager, or a CSV." }
    ST.busy=false; drawSettings();
  }
  if(e.target.id==="budgetIn"){ const v=Math.max(0,parseFloat(e.target.value)||0); S.settings.budget=Math.round(v*100)/100; persistSettings(); render() }
  if(e.target.id==="curIn"){ S.settings.cur=e.target.value.trim()||"RM"; persistSettings(); render(); drawSettings() }
  if(e.target.id==="dogName"){ S.settings.dog=e.target.value.trim()||"Mochi"; persistSettings(); renderBuddyShell(); say("Hi! I'm "+dogName()+" now 🐾","happy",4000) }
});
document.addEventListener("input",e=>{ if(e.target.id==="searchIn"&&SR){ SR.q=e.target.value; renderSearchRes() } });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("sheetRoot").innerHTML){ if(CE||WE||GE){ CE=WE=GE=null; draw() } else closeAll(); return }
  if(ED&&!CE&&!WE&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(/^[0-9]$/.test(e.key)) pressKey(e.key); else if(e.key===".") pressKey("."); else if(e.key==="Backspace") pressKey("⌫"); else if(e.key==="Enter") saveEntry();
  }
});

init();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist() }catch(e){}
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})) }
})();
</script>

</body>

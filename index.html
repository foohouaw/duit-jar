<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Duit Jar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14151E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Duit Jar</title>
<style>
html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#ECEEF8;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column. Coin-jar hero, a sideways strip of wallets, then the day-grouped ledger; a thumb-reach Add button fixed at the bottom. Palettes swap four seed colours; everything else is mixed from them. */
:root{
  --bg-l:#ECEEF8; --bg-d:#14151E; --exp:#D97A8F; --inc:#5FA585; --lid:#F4CF7B;
  --bg:var(--bg-l); --card:#FFFFFF; --ink:#2A2B3A; --muted:#7B7E93;
  --line:color-mix(in srgb,var(--ink) 11%,var(--card));
  --chip:color-mix(in srgb,var(--bg) 75%,var(--card));
  --glass:color-mix(in srgb,var(--bg) 45%,var(--card));
  --exp-soft:color-mix(in srgb,var(--exp) 17%,var(--card));
  --inc-soft:color-mix(in srgb,var(--inc) 20%,var(--card));
  --lid-deep:color-mix(in srgb,var(--lid) 72%,#5a3d00);
  --on-accent:#FFFFFF;
  --fur:#FFFFFF; --fur-ear:#F6EDE1; --fur-line:#DCD3C6;
  --shadow:0 6px 22px color-mix(in srgb,var(--ink) 9%,transparent);
  --scrim:rgba(24,24,40,.36);
  --display:"Bricolage Grotesque","Manrope","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --body:"Manrope","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-palette="matcha"]{--bg-l:#EDF0E4;--bg-d:#131610;--exp:#C88A60;--inc:#6F9A52;--lid:#EBC77E}
:root[data-palette="peach"]{--bg-l:#FBEEE8;--bg-d:#1B1513;--exp:#E2786A;--inc:#3FA197;--lid:#F5C86A}
:root[data-palette="lavender"]{--bg-l:#F1EEF8;--bg-d:#17141F;--exp:#C47AA4;--inc:#6E93D3;--lid:#F2D68C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:var(--bg-d); --card:color-mix(in srgb,var(--bg-d),#ffffff 7%); --ink:#ECEDF4; --muted:#9C9FB4;
  --exp-soft:color-mix(in srgb,var(--exp) 24%,var(--card)); --inc-soft:color-mix(in srgb,var(--inc) 26%,var(--card));
  --shadow:0 6px 22px rgba(0,0,0,.32); --scrim:rgba(0,0,0,.55); --fur:#F5F1EA; --fur-ear:#E8DDCC; --fur-line:#A89E8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:var(--bg-d); --card:color-mix(in srgb,var(--bg-d),#ffffff 7%); --ink:#ECEDF4; --muted:#9C9FB4;
  --exp-soft:color-mix(in srgb,var(--exp) 24%,var(--card)); --inc-soft:color-mix(in srgb,var(--inc) 26%,var(--card));
  --shadow:0 6px 22px rgba(0,0,0,.32); --scrim:rgba(0,0,0,.55); --fur:#F5F1EA; --fur-ear:#E8DDCC; --fur-line:#A89E8F; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid color-mix(in srgb,var(--inc) 70%,transparent);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:460px;margin:0 auto;padding-inline:16px;padding-block:14px 130px;display:flex;flex-direction:column;gap:16px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:10px;background:var(--lid);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#5a3d00;box-shadow:inset 0 -3px 0 var(--lid-deep)}
.icon-btn{width:40px;height:40px;border-radius:14px;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted)}
.month button:active{background:var(--chip)}
.month span{font-family:var(--display);font-weight:700;min-width:100px;text-align:center;font-size:15px}

/* hero */
.hero{background:var(--card);border-radius:28px;padding:18px;display:grid;grid-template-columns:88px 1fr;gap:18px;align-items:center;box-shadow:var(--shadow)}
.jar{width:88px;height:auto;display:block}
.jar .glass{fill:var(--glass);stroke:var(--line);stroke-width:3}
.jar .lid{fill:var(--lid)} .jar .lid-edge{fill:var(--lid-deep)} .jar .slot{fill:#5a3d00;opacity:.5}
.jar .liquid{fill:var(--inc-soft);transition:y .7s cubic-bezier(.3,1.3,.5,1),height .7s cubic-bezier(.3,1.3,.5,1)}
.jar.over .liquid{fill:var(--exp-soft)}
.jar .coin{fill:var(--lid);stroke:var(--lid-deep);stroke-width:1.5}
.jar .shine{fill:none;stroke:var(--card);stroke-width:3;stroke-linecap:round;opacity:.85}
.hero-body{min-width:0;display:flex;flex-direction:column;gap:8px}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(28px,8.4vw,36px);line-height:1.05;overflow-wrap:anywhere}
.big small{font-size:.48em;font-weight:600;color:var(--muted);margin-right:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:var(--chip);color:var(--muted)}
.pill b{color:var(--ink);font-weight:800}
.pill.good{background:var(--inc-soft)} .pill.good b{color:var(--inc)}
.pill.bad{background:var(--exp-soft)} .pill.bad b{color:var(--exp)}
.link{color:var(--inc);font-weight:800;text-decoration:underline;text-underline-offset:3px}

/* wallets strip */
.wstrip{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.wstrip::-webkit-scrollbar{display:none}
.wcard{flex:0 0 auto;width:auto;min-width:138px;max-width:240px;scroll-snap-align:start;background:var(--card);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;box-shadow:var(--shadow);border:2px solid transparent}
.wcard[aria-pressed="true"]{border-color:var(--ink)}
.wcard .wname{font-weight:800;font-size:13px;color:var(--muted);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wbal{font-family:var(--display);font-weight:700;font-size:16px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wbal.neg{color:var(--exp)}
.wcard.add{justify-content:center;align-items:center;color:var(--muted);background:transparent;box-shadow:none;border:2px dashed var(--line);font-weight:800;font-size:13px;width:110px}
.wicon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--wc) 16%,var(--card));color:var(--wc)}
.wicon.sm{width:24px;height:24px;border-radius:8px} .wicon.sm svg{width:15px;height:15px}
.wicon.all{--wc:var(--ink)}
.filterbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border-radius:16px;padding:8px 10px;box-shadow:var(--shadow);font-weight:800;font-size:14px}
.filterbar .l{display:flex;align-items:center;gap:8px;min-width:0}
.filterbar .l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filterbar .r{display:flex;gap:6px}
.mini{padding:6px 10px;border-radius:10px;background:var(--chip);font-weight:800;font-size:12.5px}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:16px;padding:4px;gap:4px;border:1px solid var(--line)}
.tabs button{padding:9px 0;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 8px color-mix(in srgb,var(--ink) 7%,transparent)}

/* ledger */
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 6px;font-weight:800;font-size:13px;color:var(--muted)}
.day-card{background:var(--card);border-radius:22px;padding:4px 12px;box-shadow:var(--shadow)}
.tx{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 0}
.tx + .tx{border-top:1px dashed var(--line)}
.bubble{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;font-size:21px;background:var(--exp-soft)}
.bubble.inc{background:var(--inc-soft)} .bubble.neu{background:var(--chip);color:var(--muted)}
.tx-main{min-width:0}
.tx-cat{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-note{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-family:var(--display);font-weight:700;font-size:16px;white-space:nowrap}
.amt.inc{color:var(--inc)} .amt.neu{color:var(--muted)}
.gap{height:14px}

/* empty */
.empty{background:var(--card);border-radius:24px;padding:26px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:var(--shadow)}
.empty h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:800;font-size:15px}
.btn.primary{background:var(--ink);color:var(--card)}
.btn.soft{background:var(--card);border:1px solid var(--line)}
.btn.danger{background:var(--exp-soft);color:var(--exp)}
.btn[disabled]{opacity:.45;cursor:default}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* stats */
.panel{background:var(--card);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-family:var(--display);font-weight:700;font-size:17px}
.catrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center}
.catrow .bubble{width:34px;height:34px;border-radius:12px;font-size:17px}
.catrow .meta{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.catrow .meta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow .meta span:last-child{color:var(--muted);font-weight:700}
.bar{height:9px;border-radius:9px;background:var(--chip);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:9px;background:var(--exp)}
.bar.inc i{background:var(--inc)}
.chart svg{width:100%;height:auto;display:block}
.chart .col{fill:var(--exp-soft)} .chart .col.today{fill:var(--exp)}
.chart .axis{fill:var(--muted);font:700 9px var(--body)}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}

/* add button */
.fab-wrap{position:fixed;left:0;right:0;bottom:0;padding:24px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;background:linear-gradient(to top,var(--bg) 45%,transparent)}
.fab{pointer-events:auto;height:58px;padding:0 26px 0 18px;border-radius:22px;background:var(--ink);color:var(--card);font-family:var(--display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 26px color-mix(in srgb,var(--ink) 30%,transparent)}
.fab span{width:32px;height:32px;border-radius:11px;background:var(--lid);color:#4d3600;display:grid;place-items:center;font-size:22px;line-height:1}
.fab:active{transform:scale(.97)}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:94%;overflow-y:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;}
.sheet.in{animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.scrim.in{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);align-self:center}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--chip);padding:4px;border-radius:16px}
.seg button{padding:9px 4px;border-radius:12px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.seg button[aria-pressed="true"].e{background:var(--exp);color:var(--on-accent)}
.seg button[aria-pressed="true"].i{background:var(--inc);color:var(--on-accent)}
.amount-display{font-family:var(--display);font-weight:700;font-size:44px;text-align:center;line-height:1.1;padding:2px 0;overflow-wrap:anywhere}
.amount-display small{font-size:20px;color:var(--muted);margin-right:6px}
.amount-display.zero{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;border:2px solid transparent;font-size:11.5px;font-weight:800;color:var(--muted);min-width:0}
.cat em{font-style:normal;font-size:22px;width:44px;height:44px;border-radius:15px;background:var(--chip);display:grid;place-items:center}
.cat span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.cat[aria-pressed="true"] em{background:color-mix(in srgb,var(--lid) 35%,var(--card))}
.cat.dashed em{border:2px dashed var(--line);background:transparent;font-size:20px;color:var(--muted)}
.wpick{display:flex;flex-direction:column;gap:6px}
.wrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.wrow::-webkit-scrollbar{display:none}
.wchip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:6px 12px 6px 6px;border-radius:14px;background:var(--chip);border:2px solid transparent;font-weight:800;font-size:13.5px;white-space:nowrap}
.wchip[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.field{background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);width:100%;min-width:0}
input.field::placeholder{color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:50px;border-radius:16px;background:var(--chip);font-family:var(--display);font-weight:700;font-size:22px}
.keypad button:active{background:var(--line)}
.save{height:54px;border-radius:18px;background:var(--ink);color:var(--card);font-family:var(--display);font-weight:700;font-size:18px}
.save[disabled]{opacity:.4}
.confirm{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--exp-soft);border-radius:16px;padding:10px 12px;font-weight:700;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);margin:0}
.warn{font-size:13.5px;color:var(--exp);font-weight:700;margin:0}

/* pickers */
.emoji-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emoji-grid button{aspect-ratio:1;max-width:100%;border-radius:12px;font-size:22px;display:grid;place-items:center;border:2px solid transparent}
.emoji-grid button[aria-pressed="true"]{border-color:var(--ink);background:var(--chip)}
.emoji-group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-top:4px}
.preview-cat{display:flex;align-items:center;gap:12px}
.kind-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kind-grid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:14px;border:2px solid transparent;font-size:11.5px;font-weight:800;color:var(--muted)}
.kind-grid button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;background:var(--sw);border:3px solid var(--card);box-shadow:0 0 0 2px transparent}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.palettes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pal{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--card);border:2px solid transparent;font-weight:800;font-size:13.5px;text-align:left}
.pal[aria-pressed="true"]{border-color:var(--ink)}
.pal .dots{display:flex}
.pal .dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--card);margin-left:-6px}
.pal .dots i:first-child{margin-left:0}

/* settings */
.set-block{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.set-block h3{margin:0;font-family:var(--display);font-weight:700;font-size:16px}
.set-block p{margin:0;color:var(--muted);font-size:13.5px}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.preview{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.preview .kv{display:flex;justify-content:space-between;gap:8px}
.preview .kv span:first-child{color:var(--muted)}
.preview .kv b{text-align:right}
.inline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
.wlist{display:flex;flex-direction:column;gap:6px}
.wline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px 10px;text-align:left;font-weight:800}
.wline span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wline .num{color:var(--muted);font-weight:700}
.status{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--inc);flex:none}
.dot.local{background:var(--lid-deep)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

/* v4 additions */
[hidden]{display:none!important}
.top-r{display:flex;gap:8px}
@media (max-width:440px){.brand span{display:none}}
.page{display:flex;flex-direction:column;gap:16px}
.catrow{width:100%;text-align:left;padding:3px 0;border-radius:12px}
.buddy{display:flex;align-items:flex-end;gap:10px;margin-bottom:-6px}
.dogbtn{flex:none;border-radius:20px}
.dogwrap{position:relative;display:block;width:78px}
.dog{width:78px;height:auto;display:block;overflow:visible;transform-origin:60px 112px}
.dog .o circle{fill:var(--fur-line);stroke:var(--fur-line);stroke-width:5}
.dog .tail{transform-origin:94px 90px;transform-box:view-box;animation:wag 1.1s ease-in-out infinite alternate}
.dog.happy .tail{animation-duration:.16s}
.dog.sad .tail{animation:none;transform:rotate(22deg)}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
.dog .eyes{transform-origin:60px 48px;transform-box:view-box;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
.dog .tongue,.dog .m-sad{display:none}
.dog.happy .tongue{display:inline}
.dog.sad .m-sad{display:inline} .dog.sad .m-ok{display:none}
.dog.hop{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:none}35%{transform:translateY(-12px) rotate(-5deg)}70%{transform:translateY(0) rotate(3deg)}100%{transform:none}}
.heart{position:absolute;left:50%;top:6px;color:var(--exp);font-size:17px;pointer-events:none;opacity:0;animation:floatup 1.2s ease-out forwards}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),-50px) scale(1.25)}}
.say{position:relative;flex:1;min-width:0;background:var(--card);border-radius:18px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);margin-bottom:16px}
.say::before{content:"";position:absolute;left:-6px;bottom:14px;width:14px;height:14px;background:var(--card);transform:rotate(45deg);border-radius:3px}
.say small{display:block;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px max(16px,calc((100% - 460px)/2)) calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.navb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);padding:4px;border-radius:12px}
.navb[aria-current="page"]{color:var(--ink)}
.nav .fab{height:54px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--display);font-weight:700;font-size:19px;overflow-wrap:anywhere}
.stat .v small{font-size:.62em;color:var(--muted)}
.stat .v.inc{color:var(--inc)} .stat .v.exp{color:var(--exp)}
.sheet .stat{background:var(--chip);box-shadow:none;padding:12px;border-radius:16px}
.stat.sm .v{font-size:16px}
.chart .ce{fill:var(--exp)} .chart .ci{fill:var(--inc)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;font-weight:800;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.le{background:var(--exp)} .li{background:var(--inc)}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;width:100%;text-align:left;padding:9px 2px;font-weight:800;font-size:14px;align-items:center}
.mrow+.mrow{border-top:1px dashed var(--line)}
.mrow .num{font-weight:700;font-size:13px;color:var(--muted)} .mrow .inc{color:var(--inc)} .mrow .exp{color:var(--exp)}
.day-card.flat{background:var(--chip);box-shadow:none}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbox .field{padding-left:40px}
.page-head h1{margin:0;font-family:var(--display);font-weight:700;font-size:28px}
.page-head p{margin:2px 0 0;color:var(--muted);font-weight:700}
.goal{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:24px;padding:14px;box-shadow:var(--shadow)}
.gic{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:color-mix(in srgb,var(--lid) 30%,var(--card))}
.gic.big{width:56px;height:56px;flex:none}
.goal.done .gic{background:var(--inc-soft)}
.gmain{display:flex;flex-direction:column;gap:6px;min-width:0}
.gtop{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.gtop b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtop .num{font-family:var(--display);font-weight:700;color:var(--inc)}
.gbar{height:10px;border-radius:10px;background:var(--chip);overflow:hidden;display:block}
.gbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--inc),color-mix(in srgb,var(--inc) 50%,var(--lid)))}
.gsub{font-size:13px;font-weight:700;color:var(--muted)}
.gline{font-size:13px;font-weight:800}
.presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.preset{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:var(--chip);border:1px solid var(--line);font-weight:800;font-size:14px;text-align:left}
.preset span{font-size:20px}
.ring .rt{fill:none;stroke:var(--chip);stroke-width:9}
.ring .rf{fill:none;stroke:var(--inc);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .8s}
.gd-top{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ringwrap{position:relative;display:grid;place-items:center}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-in .gic{width:44px;height:44px;font-size:24px;border-radius:15px}
.ring-in b{font-family:var(--display);font-size:16px}
.tx.gadd{cursor:default}
.gright{display:flex;align-items:center;gap:8px}
.danger-t{color:var(--exp);background:var(--exp-soft)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.cf{position:absolute;top:-14px;width:8px;height:12px;border-radius:2px;animation:fall 2s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}

/* v5 additions */
html{touch-action:manipulation}
.month .mlabel{width:auto;min-width:108px;height:32px;border-radius:12px;padding:0 8px;font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.month .mlabel::after{content:"";width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-2px) rotate(45deg)}
.nav{grid-template-columns:1fr 1fr auto 1fr 1fr}
.navb{font-size:11px}
.ynav{display:flex;align-items:center;justify-content:space-between;background:var(--chip);border-radius:16px;padding:4px}
.ynav button{width:44px;height:40px;border-radius:12px;font-size:22px;color:var(--muted)}
.ynav b{font-family:var(--display);font-size:20px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mcell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:16px;background:var(--chip);border:2px solid transparent;font-weight:800;font-size:15px}
.mcell small{font-size:11.5px;font-weight:700;color:var(--muted)}
.mcell.has small{color:var(--exp)}
.mcell.now{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--inc) 50%,transparent)}
.mcell.future{opacity:.45}
.mcell[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.ychips{display:flex;gap:8px;flex-wrap:wrap}
.ychip{padding:7px 12px;border-radius:12px;background:var(--chip);font-weight:800;font-size:13.5px;border:2px solid transparent}
.ychip[aria-pressed="true"]{border-color:var(--ink)}
.petgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.petopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:16px;background:var(--card);border:2px solid transparent;font-size:12px;font-weight:800;color:var(--muted);min-width:0}
.petopt .dog{width:54px}
.petopt[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:2px 16px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-weight:800;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.chip.w{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px}
.highlights{display:flex;flex-direction:column;gap:10px}
.hl{display:flex;gap:10px;align-items:flex-start;font-weight:700;font-size:14px}
.hl span{font-size:18px;line-height:1.25;flex:none}
.donut-wrap{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:350px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.donut{width:130px;height:130px}
.dn-l{fill:var(--muted);font:800 11px var(--body)}
.dn-v{fill:var(--ink);font:700 18px var(--display)}
.legend-list{display:flex;flex-direction:column;gap:2px;min-width:0;width:100%}
.lg{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-weight:800;font-size:13.5px;text-align:left;padding:5px 0;width:100%}
.lg i{width:10px;height:10px;border-radius:3px}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .num{color:var(--muted);font-weight:700}
.chart .line{fill:none;stroke:var(--inc);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--inc-soft)}
.chart .dotend{fill:var(--inc);stroke:var(--card);stroke-width:2}
.chart .valtxt{fill:var(--ink);font:800 10px var(--body)}
.chart .wd{fill:var(--exp-soft)} .chart .wd.top{fill:var(--exp)}
.hbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-weight:800;font-size:14px}

/* v6 additions */
.cats.scroll{grid-auto-flow:column;grid-template-columns:none;grid-template-rows:repeat(2,auto);grid-auto-columns:74px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px;scroll-snap-type:x proximity}
.cats.scroll::-webkit-scrollbar{display:none}
.cats.scroll .cat{scroll-snap-align:start}
.recent{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding:0 16px 2px}
.recent::-webkit-scrollbar{display:none}
.rchip{flex:none;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 8px;border-radius:14px;background:var(--chip);border:1px solid var(--line);font-weight:800;font-size:13px;max-width:210px}
.rchip em{font-style:normal;font-size:18px}
.rchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rchip b{color:var(--muted);font-weight:700}
.datechips{display:flex;gap:8px;align-items:center}
.dchip{flex:none;padding:10px 12px;border-radius:12px;background:var(--chip);border:2px solid transparent;font-weight:800;font-size:13.5px}
.dchip[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
.datechips .field{flex:1;min-width:0}
.keypad{grid-template-columns:repeat(4,1fr)}
.keypad button{height:48px}
.keypad .op{color:var(--inc);font-size:24px}
.amount-display .eq{display:block;font-size:15px;color:var(--muted);font-family:var(--body);font-weight:700;line-height:1.3}
.sheet .save.sticky{position:sticky;bottom:0;z-index:2;box-shadow:0 10px 0 var(--card),0 -10px 18px var(--card)}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--chip);border-radius:14px;padding:10px 12px;font-weight:800;font-size:14px}
.switchrow small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--inc)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
.toast{display:flex;align-items:center;gap:14px}
.toast button{color:var(--lid);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.bar.ok i{background:var(--inc)} .bar.warn i{background:var(--lid-deep)} .bar.over i{background:var(--exp)}
.of{color:var(--muted);font-weight:600;font-size:.8em}
.private :is(.num,.amt,.big,.valtxt,.dn-v,.wbal,.pill):not(.amount-display):not(.mlabel){filter:blur(7px)}
#privBtn[aria-pressed="true"]{background:var(--ink);color:var(--card)}
@keyframes slidel{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slider{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.slide-l{animation:slidel .25s ease} .slide-r{animation:slider .25s ease}

/* ===== v7 premium layer ===== */
.padfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:3;margin:0 -16px calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -14px 22px -16px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.padfoot .keypad{gap:7px}
.padfoot .keypad button{height:46px}
.save[disabled]{opacity:1;background:color-mix(in srgb,var(--ink) 22%,var(--card));color:var(--card);box-shadow:none}
.sheet > *{flex-shrink:0}
:root{--sel:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sel:color-mix(in srgb,var(--bg-d),#ffffff 15%)}}
:root[data-theme="dark"]{--sel:color-mix(in srgb,var(--bg-d),#ffffff 15%)}
.tabs button[aria-selected="true"]{background:var(--sel)!important}
.hero .pills{gap:8px}
.hero .meter{flex-basis:100%;height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:2px}
.hero .meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--inc) 60%,#fff),var(--inc))}
.hero .meter.over i{background:linear-gradient(90deg,color-mix(in srgb,var(--exp) 60%,#fff),var(--exp))}
.hero .hmeta{flex-basis:100%;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.7);margin-bottom:4px}
.hero .hmeta b{color:#fff;font-weight:800}
.private .hero .hmeta{filter:blur(7px)}
:root{
  --bg-l:#F1F2F6; --bg-d:#0D0E13; --hero-base:#1B1D31;
  --ink:#14151B; --muted:#7D808C;
  --line:color-mix(in srgb,var(--ink) 8%,var(--card));
  --chip:color-mix(in srgb,var(--ink) 4%,var(--card));
  --shadow:0 1px 2px rgba(18,20,30,.04),0 10px 30px -12px rgba(18,20,30,.12);
  --lift:0 18px 40px -18px rgba(18,20,30,.45);
}
:root[data-palette="matcha"]{--bg-l:#F0F2EC;--hero-base:#1A2318}
:root[data-palette="peach"]{--bg-l:#F6F1EE;--hero-base:#2A1A19}
:root[data-palette="lavender"]{--bg-l:#F3F1F7;--hero-base:#211B2E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EEF0F5;--muted:#8E92A0;--card:color-mix(in srgb,var(--bg-d),#ffffff 6%);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -14px rgba(0,0,0,.6);--lift:0 18px 40px -18px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{--ink:#EEF0F5;--muted:#8E92A0;--card:color-mix(in srgb,var(--bg-d),#ffffff 6%);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -14px rgba(0,0,0,.6);--lift:0 18px 40px -18px rgba(0,0,0,.8)}
body{font-feature-settings:"tnum" 1,"ss01" 1;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.sheet-head h2,.page-head h1,.month .mlabel,.empty h2{font-family:var(--display);letter-spacing:-.02em}
.big,.amt,.wbal,.stat .v,.amount-display,.gtop .num,.dn-v{font-family:var(--body)!important;font-weight:800!important;letter-spacing:-.03em}
button{transition:transform .15s ease,background-color .2s,box-shadow .2s,border-color .2s}
button:active{transform:scale(.97)}
.app{gap:18px;padding-block:12px 140px}
.page{gap:18px}

/* top bar */
.brand i{background:var(--ink);color:var(--card);box-shadow:none;border-radius:10px;font-size:10.5px;letter-spacing:.02em}
.icon-btn{box-shadow:none;border:1px solid var(--line);border-radius:14px}
.month{box-shadow:none;border:1px solid var(--line)}
.month .mlabel{font-weight:700}

/* buddy */
.buddy{gap:8px;margin-bottom:-10px}
.dogwrap,.buddy .dog{width:66px}
.say{background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:none;border-radius:16px;font-size:13.5px;font-weight:600;padding:9px 13px;margin-bottom:18px}
.say::before{background:inherit;border-left:1px solid var(--line);border-bottom:1px solid var(--line);left:-7px;width:12px;height:12px;backdrop-filter:none}
.say small{font-size:10.5px;letter-spacing:.12em}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;grid-template-columns:minmax(0,1fr) 84px;padding:22px 20px;border-radius:28px;color:#fff;border:1px solid rgba(255,255,255,.06);box-shadow:var(--lift);
  background:radial-gradient(110% 90% at 100% 0%,color-mix(in srgb,var(--exp) 55%,transparent) 0%,transparent 55%),radial-gradient(90% 90% at 0% 110%,color-mix(in srgb,var(--inc) 50%,transparent) 0%,transparent 60%),linear-gradient(155deg,var(--hero-base),color-mix(in srgb,var(--hero-base),#000 35%))}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;opacity:.13;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.hero .jar{order:2;width:84px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.35))}
.hero .jar .glass{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.28)}
.hero .jar .liquid{fill:color-mix(in srgb,var(--inc) 75%,transparent)}
.hero .jar.over .liquid{fill:color-mix(in srgb,var(--exp) 80%,transparent)}
.hero .jar .shine{stroke:rgba(255,255,255,.55)}
.hero .label{color:rgba(255,255,255,.6);letter-spacing:.14em;font-size:10.5px}
.hero .big{color:#fff;font-size:clamp(32px,10vw,42px)}
.hero .big small{color:rgba(255,255,255,.5);font-weight:700}
.hero .pill{background:rgba(255,255,255,.1);color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.08);font-weight:600}
.hero .pill b{color:#fff}
.hero .pill.good b{color:color-mix(in srgb,var(--inc) 45%,#fff)}
.hero .pill.bad{background:color-mix(in srgb,var(--exp) 32%,transparent)}
.hero .link{color:#fff}
.hero-body > div[style]{color:rgba(255,255,255,.65)!important}

/* wallets */
.wstrip{gap:10px}
.wcard{min-width:150px;padding:14px;border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);background:linear-gradient(160deg,color-mix(in srgb,var(--wc,var(--ink)) 11%,var(--card)) 0%,var(--card) 62%)}
.wcard[aria-pressed="true"]{border-color:transparent;box-shadow:0 0 0 2px var(--ink),var(--shadow)}
.wcard .wname{font-weight:700;font-size:12.5px}
.wcard .wbal{font-size:17px}
.wcard.add{background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.wicon{border-radius:11px}

/* tabs */
.tabs{background:color-mix(in srgb,var(--ink) 5%,transparent);border:0;border-radius:14px;padding:3px}
.tabs button{font-size:13.5px;border-radius:11px;padding:8px 0}
.tabs button[aria-selected="true"]{box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 10px -4px rgba(0,0,0,.12)}

/* list + panels */
.day-head{padding:2px 4px 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.day-head .num{letter-spacing:0;text-transform:none}
.day-card,.panel,.stat,.goal,.empty,.filterbar{border:1px solid var(--line);box-shadow:var(--shadow)}
.day-card{border-radius:22px;padding:2px 14px}
.tx{padding:12px 0;gap:13px}

function norm(t){ return t.replace(/[’‘]/g,"'").replace(/[“”]/g,'"') }
function trPart(t){ t=norm(t); if(ZH[t]!==undefined) return ZH[t]; for(const [re,fn] of RX){ const m=t.match(re); if(m){ const r=fn(...m); if(r!=null) return r } } return null }
function trStr(t){ const r=trPart(t); if(r!=null) return r; if(t.includes(" · ")){ let any=false; const out=t.split(" · ").map(p=>{ const q=trPart(p); if(q!=null){any=true;return q} return p }); if(any) return out.join(" · ") } return null }
function trNode(n){ const raw=n.nodeValue; if(!raw||!/[A-Za-z]/.test(raw)) return; const p=n.parentNode; if(!p||!p.closest||p.closest("[data-notr],script,style,textarea")) return;
  const core=raw.trim(); if(!core) return; const lead=raw.slice(0,raw.indexOf(core.charAt(0))), trail=raw.slice(lead.length+core.length);
  const r=(p.closest(".nav")&&ZH_NAV[core])?ZH_NAV[core]:trStr(core);
  if(r!=null&&r!==core){ if(n.__en===undefined) n.__en=raw; n.nodeValue=lead+r+trail } }
function trAttrs(el){ if(!el.getAttribute||el.closest("[data-notr]")) return; for(const a of ["placeholder","aria-label"]){ const v=el.getAttribute(a); if(v&&/[A-Za-z]/.test(v)){ const r=trStr(v.trim()); if(r!=null&&r!==v){ el.__en=el.__en||{}; if(el.__en[a]===undefined) el.__en[a]=v; el.setAttribute(a,r) } } } }
function trTree(root){ if(LANG!=="zh"||!root) return; if(root.nodeType===3){ trNode(root); return } if(root.nodeType!==1) return;
  trAttrs(root); root.querySelectorAll("[placeholder],[aria-label]").forEach(trAttrs);
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())) trNode(n) }
let TRMO=null;
function startTr(){ if(TRMO){ TRMO.disconnect(); TRMO=null } if(LANG!=="zh") return; trTree(document.body);
  TRMO=new MutationObserver(ms=>{ for(const m of ms){ if(m.type==="characterData") trNode(m.target); else if(m.type==="attributes") trAttrs(m.target); else m.addedNodes.forEach(trTree) } });

function restoreEn(){ const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT); let n; while((n=w.nextNode())){ if(n.__en!==undefined){ n.nodeValue=n.__en; delete n.__en } }
  document.querySelectorAll("[placeholder],[aria-label]").forEach(el=>{ if(el.__en){ for(const a in el.__en) el.setAttribute(a,el.__en[a]); delete el.__en } }) }

function iconFor(t,c){
  const own=(S.settings.cats&&S.settings.cats[t]||[]).find(x=>x.n===c); if(own) return own.ic;
  const d=(DEF[t]||[]).find(x=>x[0].toLowerCase()===String(c).toLowerCase()); if(d) return d[1];
  for(const k in S.months){const f=S.months[k].find(x=>x.t===t&&x.c===c&&x.ic); if(f) return f.ic}
  return t==="i"?"💰":"🏷️";
}
function catList(t){
  const count={}, icons={}; const hidden=new Set((S.settings.hidden&&S.settings.hidden[t])||[]);
  for(const k in S.months) for(const x of S.months[k]) if(x.t===t){count[x.c]=(count[x.c]||0)+(x.sid||x.rid?0.01:1); if(x.ic&&!icons[x.c]&&!x.sid) icons[x.c]=x.ic}
  const out=[], seen=new Set();
  const own=S.settings.cats&&S.settings.cats[t];
  if(own){ own.forEach(x=>{ if(!seen.has(x.n)){seen.add(x.n); out.push([x.n,x.ic])} }) }
  const used=Object.keys(count).sort((a,b)=>count[b]-count[a]);
  for(const n of used) if(!seen.has(n)&&!hidden.has(n)){seen.add(n); out.push([n,icons[n]||iconFor(t,n)])}
  if(!own) for(const [n,ic] of DEF[t]) if(!seen.has(n)&&!hidden.has(n)){seen.add(n); out.push([n,ic])}
  if(!out.length) out.push(["Other","✨"]);
  return out;
}

function queue(key,fn){

      });

  }

  else if(k==="+"||k==="−"){ if(!a) return; if(/[+−.]$/.test(a)) a=a.slice(0,-1); a+=k }
  else if(k==="."){ if(cu.includes(".")) return; a+=(cu?"":"0")+"." }

  else { rec.a=a; rec.c=ED.c; rec.ic=ED.ic; delete rec.to }

}

/* ---------- import ---------- */
function loadXLSX(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=()=>res();s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)});
}
async function readFile(file){
  await loadXLSX();
  const buf=await file.arrayBuffer();
  const wb=XLSX.read(buf,{type:"array",cellDates:true});
  let best=null;
  for(const name of wb.SheetNames){ const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""}); if(!best||rows.length>best.length) best=rows }
  return best||[];
}
function num(v){ if(typeof v==="number") return v; let s=String(v||"").trim(); const neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s); s=s.replace(/[^0-9.]/g,""); const n=parseFloat(s); return isNaN(n)?NaN:(neg?-n:n) }
function parseDate(v,order){
  if(v instanceof Date&&!isNaN(v)) return ymd(v);
  if(typeof v==="number"&&v>20000&&v<80000){ const d=new Date(Math.round((v-25569)*86400000)); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()) }
  const s=String(v||"").trim(); if(!s) return null; let m;
  if((m=s.match(/^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/))) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; const D=order==="mdy"?+m[2]:+m[1], M=order==="mdy"?+m[1]:+m[2]; if(M<1||M>12||D<1||D>31) return null; return y+"-"+pad(M)+"-"+pad(D) }
  const t=Date.parse(s); return isNaN(t)?null:ymd(new Date(t));
}
function parseRows(rows,order){
  let hi=-1, H=null;
  for(let r=0;r<Math.min(rows.length,25);r++){
    const cells=rows[r].map(c=>String(c).trim().toLowerCase());
    if(cells.some(c=>/^(period|date|time|tarikh)/.test(c)) && cells.some(c=>/amount|^[a-z]{3}$|^rm$|jumlah/.test(c))){hi=r;H=cells;break}
  }
  if(hi<0) throw new Error("I couldn't find Date and Amount columns in this file. Use the Excel export from Money Manager, or a CSV with those columns.");
  const col=re=>H.findIndex(c=>re.test(c));
  const ci={ date:col(/^(period|date|time|tarikh)/), type:col(/income.*expense|^type$|in\/ex|^kind$|jenis/), cat:col(/^category|^kategori/), sub:col(/^sub.?category/),
    note:col(/^note|^nota/), desc:col(/^description|^memo|^keterangan/), acc:col(/^account|^akaun|^wallet|^asset/), to:col(/^to (wallet|account)/),
    home:H.findIndex(c=>(/^[a-z]{3}$/.test(c)&&!["cur","acc","sum"].includes(c))||c==="rm"), amt:col(/^amount|jumlah/) };
  const aCol=ci.home>=0?ci.home:ci.amt;
  if(aCol<0) throw new Error("I couldn't find an Amount column in this file.");
  let firstBig=false, secondBig=false, textDates=false;
  for(let r=hi+1;r<rows.length;r++){ const v=rows[r][ci.date]; if(typeof v==="string"){ const m=v.trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]\d{2,4}/); if(m){ textDates=true; if(+m[1]>12) firstBig=true; if(+m[2]>12) secondBig=true } } }
  let ambiguous=false;
  if(firstBig) order="dmy"; else if(secondBig) order="mdy"; else ambiguous=textDates;

  const existing=(S.settings.wallets&&S.settings.wallets.length)?S.settings.wallets:[]; const newW=[]; const byName={};
  existing.forEach(w=>{ byName[w.name.toLowerCase()]=w.id });
  function wid(name){
    const n=String(name||"").trim(); if(!n) return null;
    const k=n.toLowerCase(); if(byName[k]) return byName[k];
    const kind=guessKind(n); const id="w"+uid(); const w={id,name:n,kind,color:colorFor(kind,newW.length),open:0};
    newW.push(w); byName[k]=id; return id;
  }
  const out=[], skipped={bad:0}; const seenX=new Set();
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]; if(!row||row.every(c=>String(c).trim()==="")) continue;
    const typeRaw=ci.type>=0?String(row[ci.type]).toLowerCase().trim():"";
    const d=parseDate(row[ci.date],order); let a=num(row[aCol]);
    if((isNaN(a)||a===0)&&ci.amt>=0&&ci.amt!==aCol) a=num(row[ci.amt]);
    if(!d||isNaN(a)||a===0){skipped.bad++;continue}
    const accName=ci.acc>=0?row[ci.acc]:""; const catRaw=ci.cat>=0?String(row[ci.cat]).trim():"";
    const noteParts=[ci.sub>=0?splitEmoji(row[ci.sub]).name:"", ci.note>=0?String(row[ci.note]).trim():"", ci.desc>=0?String(row[ci.desc]).trim():""].filter(Boolean).filter((v,ix,arr)=>arr.indexOf(v)===ix);
    const note=noteParts.join(" · ").slice(0,120);
    const base={id:uid(),ts:Date.now(),d,n:note};
    if(/transfer|trans\b|pindah/.test(typeRaw)){
      const isIn=/(^|[^a-z])in\b|masuk/.test(typeRaw)&&!/out|keluar/.test(typeRaw);
      const here=wid(accName)||wid("Cash"); const otherName=(ci.to>=0&&String(row[ci.to]).trim())?String(row[ci.to]).trim():splitEmoji(catRaw).name.replace(/^transfer.*$/i,"");
      const other=wid(otherName)||wid("Other account");
      const from=isIn?other:here, to=isIn?here:other; const amt=Math.abs(Math.round(a*100)/100);
      const key=d+"|"+amt+"|"+from+"|"+to;
      if(seenX.has(key)) continue; seenX.add(key);
      out.push(Object.assign(base,{t:"x",a:amt,c:"Transfer",w:from,to})); continue;
    }
    if(/modif|balance|bal\.|adjust/.test(typeRaw)){
      out.push(Object.assign(base,{t:"a",a:Math.round(a*100)/100,c:"Balance adjustment",w:wid(accName)||wid("Cash")})); continue;
    }
    let t;
    if(/exp|out|spend|belanja|debit|keluar/.test(typeRaw)) t="e";
    else if(/inc|earn|pendapatan|credit|masuk/.test(typeRaw)) t="i";

    const cs=splitEmoji(catRaw); const cname=cs.name||"Other";
    const rec=Object.assign(base,{t,a:Math.abs(Math.round(a*100)/100),c:cname,ic:cs.ic||iconFor(t,cname)});
    const w=wid(accName); if(w) rec.w=w;
    out.push(rec);
  }
  const used=new Set(); out.forEach(x=>{ if(x.w) used.add(x.w); if(x.to) used.add(x.to) });
  const nw=newW.filter(w=>used.has(w.id));
  const names=[...used].map(id=>(existing.find(w=>w.id===id)||nw.find(w=>w.id===id)||{}).name).filter(Boolean);
  return {tx:out,skipped,ambiguous,order,newWallets:nw,walletNames:names};
}
async function doImport(){

function renderSearchRes(){
  const el=$("searchRes"); if(!el) return;
  const toks=SR.q.toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length&&SR.t==="all"){ el.innerHTML='<p class="hint">Searches every entry in every month. Try “grab”, “Maybank”, “birthday” or “12.50”.</p>'; return }
  const res=[]; for(const k in S.months) for(const x of S.months[k]){ if(SR.t!=="all"&&x.t!==SR.t) continue;
    const hay=[x.c,x.n,wallet(wOf(x)).name,x.to?wallet(x.to).name:"",money(Math.abs(x.a)),String(Math.abs(x.a)),x.d,fmtD(x.d)].join(" ").toLowerCase();
    if(toks.every(tk=>hay.includes(tk))) res.push(x) }
  res.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));
  if(!res.length){ el.innerHTML='<p class="hint">No entries match “'+esc(SR.q)+'”.</p>'; return }
  let e=0,i=0; res.forEach(x=>{if(x.t==="e")e+=x.a;else if(x.t==="i")i+=x.a});
  const shown=res.slice(0,200); const groups={}; shown.forEach(x=>{(groups[x.d]=groups[x.d]||[]).push(x)});
  el.innerHTML='<div class="pills" style="margin-bottom:10px"><span class="pill"><b class="num">'+res.length+'</b> found</span>'+(e?'<span class="pill bad">Spent <b class="num">'+money(e)+'</b></span>':'')+(i?'<span class="pill good">Earned <b class="num">'+money(i)+'</b></span>':'')+'</div>'+
    Object.keys(groups).sort().reverse().map(d=>'<section><div class="day-head"><span>'+esc(fmtD(d))+'</span></div><div class="day-card flat">'+groups[d].map(txRow).join("")+'</div></section>').join('<div style="height:8px"></div>')+
    (res.length>200?'<p class="hint">Showing the latest 200. Add another word to narrow it down.</p>':'');
}

function goalSaved(g){ if(g.w) return Math.max(0,Math.round((balances()[g.w]||0)*100)/100); return Math.round((g.adds||[]).reduce((s,a)=>s+a.a,0)*100)/100 }
function monthsLeft(g){ if(!g.date) return null; const [y,m]=g.date.split("-").map(Number); const n=new Date(); return (y-n.getFullYear())*12+(m-(n.getMonth()+1))+1 }
function goalLine(g,saved){
  if(saved>=g.target) return "Goal reached! 🎉";
  const left=g.target-saved, ml=monthsLeft(g);
  if(ml==null) return cur()+" "+money(left)+" to go";
  if(ml<=0) return "Target date has passed · "+cur()+" "+money(left)+" to go";
  return cur()+" "+money(left/ml)+" a month to reach it by "+monthName(g.date);
}
function persistGoals(){

/* ---------- analytics ---------- */
const RANGES=[["1m","This month"],["3m","3 months"],["6m","6 months"],["12m","12 months"],["year","This year"],["all","All time"]];
const CATCOL=["var(--exp)","var(--inc)","#E9B44C","#7FA7E8","#B497E0","#EE9BC0","#8CC7B5","var(--muted)"];
let WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function rangeMonths(){
  const now=ymOf(new Date()), r=S.af.r, out=[];
  if(r==="1m") return [now];
  if(r==="year"){ const y=now.slice(0,4); for(let m=1;m<=+now.slice(5);m++) out.push(y+"-"+pad(m)); return out }
  if(r==="all"){ const ks=Object.keys(S.months).filter(k=>S.months[k].length).sort(); let k=(ks[0]&&ks[0]<now)?ks[0]:now; while(k<=now){out.push(k);k=shiftMonth(k,1)} return out }
  const n=r==="3m"?3:r==="12m"?12:6; for(let i=n-1;i>=0;i--) out.push(shiftMonth(now,-i)); return out;
}
function inAF(x){return !S.af.w||wOf(x)===S.af.w||x.to===S.af.w}
function rangeTx(){const out=[]; rangeMonths().forEach(k=>(S.months[k]||[]).forEach(x=>{if(inAF(x))out.push(x)})); return out}
function rangeLabel(){return (RANGES.find(r=>r[0]===S.af.r)||RANGES[2])[1]}
function kfmt(n){n=Math.abs(n);return n>=1e6?(n/1e6).toFixed(1)+"m":n>=1e4?Math.round(n/1e3)+"k":n>=1e3?(n/1e3).toFixed(1)+"k":String(Math.round(n))}
function wdOf(d){const [y,m,dd]=d.split("-").map(Number);return (new Date(y,m-1,dd).getDay()+6)%7}
function balanceSeries(ks){
  const inSel=id=>!S.af.w||id===S.af.w;
  let open=0; wallets().forEach(w=>{if(inSel(w.id)) open+=(+w.open||0)});
  const delta={}; for(const k in S.months){ let d=0; S.months[k].forEach(x=>{const w=wOf(x);
    if(x.t==="e"){if(inSel(w))d-=x.a+(x.lent||0)} else if(x.t==="i"||x.t==="a"){if(inSel(w))d+=x.a} else if(x.t==="x"){ if(inSel(w))d-=x.a; if(x.to&&inSel(x.to))d+=x.a } }); delta[k]=d }
  const allK=Object.keys(delta).sort();
  return ks.map(k=>{let c=open; allK.forEach(m=>{if(m<=k)c+=delta[m]}); return c});
}
function monthsCompare(){
  const now=new Date(), tk=ymOf(now), lk=shiftMonth(tk,-1), day=now.getDate();
  let t=0,l=0; (S.months[tk]||[]).forEach(x=>{if(x.t==="e"&&inAF(x)&&+x.d.slice(8)<=day)t+=x.a}); (S.months[lk]||[]).forEach(x=>{if(x.t==="e"&&inAF(x)&&+x.d.slice(8)<=day)l+=x.a});

}

/* ---------- quick add helpers ---------- */
function yday(){const d=new Date();d.setDate(d.getDate()-1);return ymd(d)}
function evalAmt(s){ s=String(s||""); if(!s) return 0; const parts=s.match(/[+−]?[^+−]*/g).filter(Boolean); let t=0; for(const p of parts){ const sign=p[0]==="−"?-1:1; const v=parseFloat(p.replace(/^[+−]/,"")); if(!isNaN(v)) t+=sign*v } return Math.round(t*100)/100 }
function hasOp(s){return /[+−]/.test(String(s||"").slice(1))}
function amtInner(){ const v=evalAmt(ED.amt); return '<small>'+esc(cur())+'</small>'+(ED.t==="a"&&ED.sign<0?'−':'')+esc(ED.amt||"0")+(hasOp(ED.amt)?'<span class="eq">= '+esc(cur())+' '+money(v)+'</span>':'') }
function recentList(t){ const all=[]; for(const k in S.months) for(const x of S.months[k]) if(x.t===t) all.push(x);
  all.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0)); const seen=new Set(), out=[];
  for(const x of all){ const key=x.c+"|"+(x.n||"")+"|"+x.a; if(seen.has(key)) continue; seen.add(key); out.push(x); if(out.length>=8) break } return out }
function recentHTML(){
  if(ED.id||(ED.t!=="e"&&ED.t!=="i")) return "";
  const rl=recentList(ED.t); if(!rl.length) return "";
  return '<div class="recent" aria-label="Recent entries">'+rl.map(x=>'<button class="rchip" data-recent="'+esc(x.id)+'"><em aria-hidden="true">'+esc(x.ic||iconFor(x.t,x.c))+'</em><span>'+esc(x.n||x.c)+'</span><b class="num">'+money(x.a)+'</b></button>').join("")+'</div>';
}
function repeatRow(){

  return '<div class="switchrow"><div>Repeat every month<small>'+(ED.rep?'Added for you on day '+(+ED.d.slice(8))+' of each month':'For rent, bills, subscriptions or salary')+'</small></div><button class="sw" role="switch" data-rep="1" aria-checked="'+(!!ED.rep)+'" aria-label="Repeat every month"></button></div>';

/* ---------- repeating entries ---------- */
function runRecurring(){
  const recs=S.settings.rec||[]; if(!recs.length) return 0;
  const now=new Date(), cy=ymOf(now), td=now.getDate(); let made=0, changed=false; const touched=new Set();
  recs.forEach(r=>{ if(r.stop) return; let m=shiftMonth(r.last,1);
    while(m<=cy){ const [yy,mm]=m.split("-").map(Number); const day=Math.min(r.day,new Date(yy,mm,0).getDate());
      if(m===cy&&td<day) break;
      const id="r"+r.id+"-"+m; const arr=S.months[m]=S.months[m]||[];
      if(!arr.some(x=>x.id===id)){ const x={id,ts:Date.now(),t:r.t,a:r.a,c:r.c,n:r.n||"",d:m+"-"+pad(day),w:r.w,rid:r.id}; if(r.ic) x.ic=r.ic; if(r.to) x.to=r.to; arr.push(x); made++; touched.add(m) }
      r.last=m; changed=true; m=shiftMonth(m,1) } });
  if(changed){ touched.forEach(persistMonth); persistSettings() }
  return made;
}

  for(const k in S.months){ let ch=false; S.months[k].forEach(x=>{ const l=by[x.id]; if(l&&x.t==="e"&&!x.lent&&l<=x.a+0.004){ x.lent=Math.round(l*100)/100; x.a=Math.round((x.a-l)*100)/100; ch=true } }); if(ch){ persistMonth(k); any=true } }

function addCycle(d,cy,anchor){ const [y,m,dd]=d.split("-").map(Number); if(cy==="w") return ymd(new Date(y,m-1,dd+7));
  const nm=new Date(y,m-1+(cy==="y"?12:1),1); const dim=new Date(nm.getFullYear(),nm.getMonth()+1,0).getDate(); return ymd(new Date(nm.getFullYear(),nm.getMonth(),Math.min(anchor||dd,dim))) }

function subEntry(sb){ return {id:"s"+sb.id+"-"+sb.next,ts:Date.now(),t:"e",a:sb.a,c:"Subscriptions",ic:sb.ic,n:sb.name,d:sb.next,w:(sb.w&&wallets().some(w=>w.id===sb.w))?sb.w:wallets()[0].id,sid:sb.id} }
function runSubs(){ const subs=S.settings.subs||[]; if(!subs.length) return 0; const td=today(); let made=0, changed=false; const touched=new Set();

function deleteWallet(mode){ ensureWallets(); const id=WE.id, to=mode==="move"?WE.moveTo:null; if(mode==="move"&&!to) return; const touched=new Set();
  for(const k in S.months){ const before=S.months[k].length; let ch=false;
    if(to){ S.months[k].forEach(x=>{ if(wOf(x)===id){x.w=to;ch=true} if(x.to===id){x.to=to;ch=true} }); S.months[k]=S.months[k].filter(x=>!(x.t==="x"&&wOf(x)===x.to)) }
    else S.months[k]=S.months[k].filter(x=>wOf(x)!==id&&x.to!==id);
    if(ch||S.months[k].length!==before) touched.add(k) }
  const fw=S.settings.wallets.find(w=>w.id===id);
  if(to){ const tw=S.settings.wallets.find(w=>w.id===to); if(tw&&fw) tw.open=Math.round(((+tw.open||0)+(+fw.open||0))*100)/100 }
  S.settings.wallets=S.settings.wallets.filter(x=>x.id!==id); const first=S.settings.wallets[0].id;
  (S.goals||[]).forEach(g=>{ if(g.w===id){ if(to) g.w=to; else delete g.w } });
  (S.settings.rec||[]).forEach(r=>{ if(r.w===id) r.w=to||first; if(r.to===id) r.to=to||null });
  (S.settings.subs||[]).forEach(s=>{ if(s.w===id) s.w=to||first });
  if(S.wf===id) S.wf=null; if(S.af.w===id) S.af.w=null; if(S.settings.lastW===id) delete S.settings.lastW;
  touched.forEach(persistMonth); persistSettings(); persistGoals(); const nm=fw?fw.name:"Wallet"; WE=null; draw(); render(); toast(nm+" deleted") }

  el.innerHTML='<div class="bkcard"><span class="bubble neu" aria-hidden="true">💾</span><span class="tx-main"><div class="tx-cat">'+(gdOn()?'Sync to Google Drive':'Time to back up')+'</div><div class="tx-note">'+(S.settings.lastBackup?'Last backup: '+lastBkLabel():'Not backed up yet')+'</div></span><span class="row-btns" style="flex-wrap:nowrap"><button class="mini" data-bklater="1">Later</button>'+(gdOn()?'<button class="btn primary" data-gsync="1" style="padding:9px 14px">Sync</button>':'<button class="btn primary" data-backup="1" style="padding:9px 14px">Back up</button>')+'</span></div>' }
function backupObj(){ return {app:"duitjar",v:1,at:new Date().toISOString(),months:S.months,settings:S.settings,goals:S.goals||[]} }
async function doBackup(){
  const name="duit-jar-backup-"+today()+".json"; const json=JSON.stringify(backupObj());
  const done=()=>{ S.settings.lastBackup=today(); persistSettings(); BK_SNOOZE=false; render(); if(ST) drawSettings(); toast("Backup sent"); say("Backed up! Your data is safe with me 💾","happy",3500) };
  if(DL){ try{ await DL.save({filename:name,data:json}); done(); return }catch(e){ if(e&&e.code==="declined") return } }
  try{ const f=new File([json],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"Duit Jar backup",text:"Duit Jar backup · "+fmtD(today())}); done(); return }
    const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500); done();
  }catch(e){ if(e&&e.name==="AbortError") return; toast("Export didn't work. Try again.") }
}
async function readRestore(file){
  try{ const d=JSON.parse(await file.text()); if(!d||d.app!=="duitjar"||typeof d.months!=="object") throw 0;
    const n=Object.values(d.months).reduce((s,a)=>s+(Array.isArray(a)?a.length:0),0); ST.restore={d,n,at:d.at?fmtD(String(d.at).slice(0,10)):"?"}; drawSettings() }
  catch(e){ ST.restore=null; drawSettings(); toast("That isn't a Duit Jar backup file.") }
}
function applyRestore(){ const d=ST.restore.d; const old={months:S.months,settings:S.settings,goals:S.goals};
  const swap=(src)=>{ const oldKeys=Object.keys(S.months); S.months=JSON.parse(JSON.stringify(src.months||{})); S.settings=Object.assign({cur:"RM",budget:0},JSON.parse(JSON.stringify(src.settings||{}))); S.goals=JSON.parse(JSON.stringify(src.goals||[]));
    new Set(oldKeys.concat(Object.keys(S.months))).forEach(persistMonth); persistSettings(); persistGoals(); applyPalette(); if(S.settings.lang&&S.settings.lang!==LANG) applyLang(S.settings.lang); render(); renderBuddyShell(); buddyIdle() };
  swap(d); ST.restore=null; closeAll(); toast("Everything restored",()=>{ swap(old); toast("Restored to before the backup") }) }

(function(){ let t=null, sx=0, sy=0, el=null, block=false, held=false;
  const cancel=()=>{ clearTimeout(t); t=null; if(el) el.classList.remove("pressing"); el=null };
  document.addEventListener("pointerdown",e=>{ const r=e.target.closest("[data-edit]"); if(!r||e.button>0) return; cancel(); el=r; sx=e.clientX; sy=e.clientY; r.classList.add("pressing");
    t=setTimeout(()=>{ const id=el&&el.dataset.edit; cancel(); if(!id) return; block=true; held=true; try{ if(navigator.vibrate) navigator.vibrate(12) }catch(_){} openView(id,true) },480) },{passive:true});
  document.addEventListener("pointermove",e=>{ if(el&&(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)) cancel() },{passive:true});
  document.addEventListener("pointerup",()=>{ if(t) cancel(); if(held){ held=false; setTimeout(()=>{ block=false },350) } },{passive:true});
  document.addEventListener("pointercancel",cancel,{passive:true});
  document.addEventListener("click",e=>{ if(block){ block=false; e.stopImmediatePropagation(); e.preventDefault() } },true);
  document.addEventListener("contextmenu",e=>{ if(e.target.closest("[data-edit]")) e.preventDefault() });
})();

function gdTokOk(){ return !!GDR.tok&&GDR.exp>Date.now()+30000 }

function loadGIS(){ if(window.google&&google.accounts&&google.accounts.oauth2) return Promise.resolve(); return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true; s.onload=()=>res(); s.onerror=()=>rej(new Error("net")); document.head.appendChild(s) }) }
function gdAuth(prompt){ return loadGIS().then(()=>new Promise((res,rej)=>{ const c=google.accounts.oauth2.initTokenClient({client_id:GCID,scope:"https://www.googleapis.com/auth/drive.appdata",
  callback:r=>{ if(r&&r.access_token){ GDR.tok=r.access_token; GDR.exp=Date.now()+((+r.expires_in||3600)*1000); try{localStorage.setItem("duitjar.gtok",JSON.stringify({t:GDR.tok,exp:GDR.exp}))}catch(e){} res() } else rej(new Error("popup")) },
  error_callback:()=>rej(new Error("popup")) }); c.requestAccessToken({prompt}) })) }
async function gfetch(url,opt){ opt=opt||{}; opt.headers=Object.assign({Authorization:"Bearer "+GDR.tok},opt.headers||{}); let r;
  try{ r=await fetch(url,opt) }catch(e){ throw new Error("net") }
  if(r.status===401){ GDR.tok=null; GDR.exp=0; try{localStorage.removeItem("duitjar.gtok")}catch(e){} throw new Error("401") }
  if(!r.ok) throw new Error("net"); return r }
async function gdFind(){ if(GDR.fileId) return GDR.fileId; const r=await gfetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q="+encodeURIComponent("name='duitjar-backup.json'")); const j=await r.json(); const f=(j.files||[])[0]; if(f) GDR.fileId=f.id; return GDR.fileId }

async function gdFindName(name){ GDR.ids=GDR.ids||{}; if(GDR.ids[name]) return GDR.ids[name]; const r=await gfetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q="+encodeURIComponent("name='"+name+"'")); const j=await r.json(); const f=(j.files||[])[0]; if(f) GDR.ids[name]=f.id; return f?f.id:null }
async function gdPut(name,body){ const id=await gdFindName(name);
  if(id){ await gfetch("https://www.googleapis.com/upload/drive/v3/files/"+id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body}); return }
  const b="duitjar"+Date.now(); const meta=JSON.stringify({name,parents:["appDataFolder"],mimeType:"application/json"});
  const mp="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+meta+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--";
  const r=await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:mp}); const j=await r.json(); GDR.ids[name]=j.id }
async function gdList(){ const r=await gfetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=50&fields=files(id,name,modifiedTime)"); const j=await r.json(); return (j.files||[]).filter(f=>/^duitjar-(backup|day-\d)\.json$/.test(f.name)).sort((a,b)=>a.modifiedTime<b.modifiedTime?1:-1) }

function entryHour(x){ if(x.ts&&x.d){ const d=new Date(x.ts); if(ymd(d)===x.d) return d.getHours() } return null }
function hourDist(a,b){ const d=Math.abs(a-b); return Math.min(d,24-d) }
function quickPicks(t){
  const now=Date.now(), hr=new Date().getHours(), lim=ymd(new Date(now-120*864e5)); const g={};

    if(x.t!==t||x.d<lim||x.rid||(x.c==="Subscriptions"&&String(x.id)[0]==="s")) continue;
    const key=x.c+"|"+String(x.n||"").toLowerCase()+"|"+x.a+"|"+wOf(x);
    const o=g[key]=g[key]||{x,n:0,score:0};
    const age=Math.max(0,(now-new Date(x.d+"T12:00"))/864e5);
    let s=1+Math.max(0,1-age/30); const h=entryHour(x); if(h!=null){ const dh=hourDist(h,hr); if(dh<=1) s+=1.5; else if(dh<=3) s+=.6 }
    o.n++; o.score+=s; if(x.d>o.x.d||(x.d===o.x.d&&(x.ts||0)>(o.x.ts||0))) o.x=x;
  }
  return Object.values(g).sort((a,b)=>b.score-a.score).slice(0,10);
}

function people(){ const m={}; ious().forEach(o=>{ const p=m[o.who]=m[o.who]||{who:o.who,net:0,open:0,items:[],last:""}; const l=iouLeft(o); if(l>0.004){ p.net+=o.dir==="in"?l:-l; p.open++ } p.items.push(o); if(o.d>p.last) p.last=o.d });
  Object.values(m).forEach(p=>{ p.net=Math.round(p.net*100)/100 });

/* monthly wrapped */
function wrapData(ym){
  const tx=S.months[ym]||[]; let E=0,I=0,n=0; const cat={}, day={}, cnt={};
  tx.forEach(x=>{ if(x.t==="e"){ E+=x.a; n++; cat[x.c]=(cat[x.c]||0)+x.a; cnt[x.c]=(cnt[x.c]||0)+1; day[x.d]=(day[x.d]||0)+x.a } else if(x.t==="i") I+=x.a });
  const prevE=totals(shiftMonth(ym,-1)).e;
  const topC=Object.keys(cat).sort((a,b)=>cat[b]-cat[a])[0], freqC=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||cat[b]-cat[a])[0], bigD=Object.keys(day).sort((a,b)=>day[b]-day[a])[0];
  const [y,m]=ym.split("-").map(Number); const dim=new Date(y,m,0).getDate(); const upto=ym===ymOf(new Date())?new Date().getDate():dim;
  const ds=new Set(tx.map(x=>x.d)); let best=0,run=0; for(let d=1;d<=upto;d++){ if(ds.has(ym+"-"+pad(d))){ run++; best=Math.max(best,run) } else run=0 }
  const cb=S.settings.cb||{}; const lk=Object.keys(cb);
  return {ym,E,I,n,prevE,pct:prevE>0?Math.round((E-prevE)/prevE*100):null,topC,topA:topC?cat[topC]:0,topP:E?Math.round((topC?cat[topC]:0)/E*100):0,freqC,freqN:freqC?cnt[freqC]:0,bigD,bigA:bigD?day[bigD]:0,noSpend:Math.max(0,upto-Object.keys(day).length),best,avg:E/upto,kept:lk.filter(k=>(cat[k]||0)<=cb[k]).length,lims:lk.length,count:tx.length};
}

function drawBalances(){ const b=balances();
  const body='<p class="hint">Type what’s really in each wallet right now (check your bank or TNG app). Duit Jar adjusts the starting balance, so your past entries stay the same.</p>'+
    '<div class="bglist">'+wallets().map(w=>'<div class="bgrow nw">'+wIcon(w)+'<div class="bgmid"><b>'+esc(w.name)+'</b><small><span>Now in app</span> <span class="num">'+money(b[w.id]||0)+'</span></small></div><span class="nwin"><button class="mini" data-nwneg="'+esc(w.id)+'" aria-label="Plus or minus">±</button><input class="field num bgin" data-nwin="'+esc(w.id)+'" inputmode="decimal" value="'+esc(NW.v[w.id])+'" aria-label="Balance"></span></div>').join("")+'</div>'+
    '<button class="save" id="nwSave">Save balances</button><button class="btn soft" data-addwallet="1">+ Add wallet</button>';
  keepScroll(()=>{ $("sheetRoot").innerHTML=shell("Balances",body) });
}
function saveBalances(){ syncNW(); ensureWallets(); const b=balances(); let n=0;
  S.settings.wallets.forEach(w=>{ if(!(w.id in NW.v)) return; const want=numIn(NW.v[w.id]); const now=Math.round((b[w.id]||0)*100)/100; if(Math.abs(want-now)>0.004){ w.open=Math.round(((+w.open||0)+want-now)*100)/100; n++ } });
  persistSettings(); closeAll(); render(); toast(n?"Balances updated":"No changes"); if(n) say("Now our wallets match real life ✨","happy",4000) }
function netWorthPanel(){ const b=balances(); const ws=wallets(); const tot=ws.reduce((s,w)=>s+(b[w.id]||0),0); const {inn,out}=iouTotals(); const nw=tot+inn-out;
  const mx=Math.max(1,...ws.map(w=>Math.abs(b[w.id]||0)),inn,out);
  const row=(ic,name,v,col)=>'<div class="nwrow">'+ic+'<div style="min-width:0"><div class="meta"><span>'+name+'</span><span class="num'+(v<0?' neg':'')+'">'+(v<0?'−':'')+money(Math.abs(v))+'</span></div><div class="bar"><i style="width:'+(Math.abs(v)/mx*100).toFixed(1)+'%;background:'+(v<0?'var(--exp)':col)+'"></i></div></div></div>';
  return '<section class="panel nwpanel"><div class="nwtop"><div style="min-width:0"><div class="label">Net worth</div><div class="big num'+(nw<0?' neg':'')+'"><small>'+esc(cur())+'</small>'+(nw<0?'−':'')+money(Math.abs(nw))+'</div></div><button class="mini" data-nwopen="1">Update</button></div>'+
    ws.map(w=>row(wIcon(w,true),esc(w.name),b[w.id]||0,esc(w.color||"var(--inc)"))).join("")+
    (inn>0.004?row('<span class="wicon sm" style="--wc:var(--inc)" aria-hidden="true">🤝</span>','<span>Owed to you</span>',inn,"var(--inc)"):'')+
    (out>0.004?row('<span class="wicon sm" style="--wc:var(--exp)" aria-hidden="true">🤝</span>','<span>You owe</span>',-out,"var(--exp)"):'')+'</section>';
}
function statsExtra(){ return netWorthPanel()+'<button class="subcard" data-wrap="prev"><span class="bubble neu" aria-hidden="true">🎁</span><span class="tx-main"><div class="tx-cat">Monthly Wrapped</div><div class="tx-note">Your month in one cute card</div></span><span class="chev" aria-hidden="true">›</span></button>' }

/* home cards */
function renderXCards(){ const el=$("xcard"); if(!el) return; if(S.mode==="loading"||S.page!=="home"||S.tab==="year"){ el.innerHTML=""; return }
  let h=""; const cm=ymOf(new Date()), pm=shiftMonth(cm,-1);
  if(new Date().getDate()<=10&&(S.settings.wrapSeen||"")<pm&&(S.months[pm]||[]).length>=3)
    h+='<button class="subcard wrapnote" data-wrap="prev"><span class="bubble neu" aria-hidden="true">🎁</span><span class="tx-main"><div class="tx-cat"><span>'+esc(monthName(pm).split(" ")[0])+'</span> <span>Wrapped is ready</span></div><div class="tx-note">Tap to see your month</div></span><span class="chev" aria-hidden="true">›</span></button>';
  if(S.view===cm&&S.tab==="daily"){ const st=budStatus(); if(st.length){ const warn=st.filter(s=>s.p>=.8&&s.p<=1).length, over=st.filter(s=>s.p>1).length;
    h+='<button class="budcard" data-bgopen="1"><div class="bchead"><span class="tx-cat">🎯 <span>Budgets</span></span><span class="tx-note">'+(over||warn?[over?over+' over limit':'',warn?warn+' near limit':''].filter(Boolean).join(' · '):'All on track')+'</span></div>'+
      st.slice(0,3).map(s=>'<div class="bcrow"><span class="bce" aria-hidden="true">'+esc(iconFor("e",s.k))+'</span><div class="bar '+budCls(s.p)+'"><i style="width:'+Math.min(100,s.p*100).toFixed(1)+'%"></i></div><span class="num">'+money(Math.abs(s.lim-s.sp))+' <span>'+(s.p>1?'over':'left')+'</span></span></div>').join("")+'</button>' } }
  if(S.tab==="daily"&&!S.settings.nwHintOff){ const b=balances(); const neg=wallets().filter(w=>w.kind!=="card"&&(b[w.id]||0)<-0.004);
    if(neg.length) h+='<div class="bkcard nwcard"><span class="bubble neu" aria-hidden="true">⚖️</span><span class="tx-main"><div class="tx-cat">Fix your balances</div><div class="tx-note">Some wallets are below zero. Set what’s really in them.</div></span><span class="row-btns" style="flex-wrap:nowrap"><button class="mini" data-nwhide="1">Later</button><button class="btn primary" data-nwopen="1" style="padding:9px 14px">Fix</button></span></div>' }
  el.innerHTML=h;
}

/* sheet plumbing */
function drawExt(){ if(BG) drawBudgets(); else if(IE) drawIE(); else if(WR) drawWrapped(); else if(NW) drawBalances(); else return false; return true }
function extClick(t,ds){
  const top=topSheet();
  if(ds.bgopen){ if(ST) closeAll(); openBudgets(); return true }
  if(ds.act==="budget"){ openBudgets(); return true }
  if(ds.nwopen){ if(WE){ WE=null } if(ST) closeAll(); openBalances(); return true }
  if(ds.nwhide){ S.settings.nwHintOff=1; persistSettings(); renderXCards(); return true }
  if(ds.wrap){ openWrapped(); return true }
  if(ds.iouwho&&!t.closest(".sheet")){ openPerson(ds.iouwho); return true }
  if(ds.iounew&&!t.closest(".sheet")){ IE=null; openIOU(ds.iounew); return true }
  if(t.id==="addBtn"&&S.page==="goals"&&S.plan==="iou"){ openIOU("in"); return true }
  if(top==="ED"){
    if(ds.recent){ const f=findTx(ds.recent); if(!f) return true; syncFields(); if(ED.qp===ds.recent&&canSave()){ saveEntry(); return true }
      const x=f.x; ED.c=x.c; ED.ic=x.ic||iconFor(x.t,x.c); ED.n=x.n||""; ED.amt=String(x.a); if(wallets().some(w=>w.id===wOf(x))) ED.w=wOf(x); ED.qp=ds.recent; drawEditor(); return true }
    if(ds.split){ syncFields(); ED.split=ED.split||{ppl:[],mode:"even",me:true}; ED.split.on=!ED.split.on; drawEditor(); if(ED.split.on) setTimeout(()=>{ const i=$("splitWho"); if(i) i.scrollIntoView({block:"center",behavior:"smooth"}) },60); return true }
    if(ds.splitp){ syncFields(); const sp=ED.split; sp.ppl=sp.ppl||[]; sp.ppl=sp.ppl.includes(ds.splitp)?sp.ppl.filter(x=>x!==ds.splitp):sp.ppl.concat([ds.splitp]); drawEditor(); return true }
    if(ds.splitadd){ syncFields(); addSplitName(); drawEditor(); setTimeout(()=>{ const i=$("splitWho"); if(i) i.focus() },30); return true }
    if(ds.splitm){ syncFields(); ED.split.mode=ds.splitm; if(ds.splitm==="custom"){ const sh=splitShares(evalAmt(ED.amt)); ED.split.amts=ED.split.amts||{}; (ED.split.ppl||[]).forEach(n=>{ if(!ED.split.amts[n]&&sh[n]) ED.split.amts[n]=String(sh[n]) }) } drawEditor(); return true }
    if(ds.splitme){ syncFields(); ED.split.me=ED.split.me===false; drawEditor(); return true }
    if(ds.key||ds.cat||ds.pickw||ds.type) ED.qp=null;
    return false;
  }
  if(top==="BG"){
    if(ds.bgavg){ syncBudgets(); BG.v[ds.bgavg]=ds.v; drawBudgets(); return true }
    if(t.id==="bgSave"){ saveBudgets(); return true }
    return false;
  }
  if(top==="NW"){
    if(ds.nwneg){ syncNW(); const v=String(NW.v[ds.nwneg]||"").trim(); NW.v[ds.nwneg]=v.startsWith("-")?v.slice(1):"-"+(v||"0"); drawBalances(); return true }
    if(t.id==="nwSave"){ saveBalances(); return true }
    if(ds.addwallet) syncNW();
    return false;
  }
  if(top==="WR"){
    if(ds.wrm){ const n=shiftMonth(WR.ym,+ds.wrm); if(n<=ymOf(new Date())){ WR.ym=n; drawWrapped() } return true }
    if(ds.wrshare){ shareWrapped(); return true }
    return false;
  }
  if(top==="IE"){
    if(ds.back){ syncIE(); if(IE.view==="new"&&IE.back) openPerson(IE.back); else { IE=null; draw() } return true }
    if(IE.view==="new"){
      if(ds.ioud){ syncIE(); IE.dir=ds.ioud; drawIE(); return true }
      if(ds.ioup){ syncIE(); IE.who=ds.ioup; drawIE(); setTimeout(()=>{ const i=$("iouAmt"); if(i&&!i.value) i.focus() },60); return true }
      if(t.id==="iouSave"){ saveIOU(); return true }
      return false;
    }
    if(ds.iounew){ syncIE(); openIOU(ds.iounew,ds.iouw2); return true }
    if(ds.iourec){ syncIE(); IE.rec=!IE.rec; drawIE(); return true }
    if(ds.pickw&&ds.role==="iouw"){ syncIE(); IE.w=ds.pickw; drawIE(); return true }
    if(ds.iousettle){ settleIOU(); return true }
    if(ds.ioudel){ syncIE(); IE.del=ds.ioudel; drawIE(); return true }
    if(ds.ioudelno){ syncIE(); IE.del=null; drawIE(); return true }
    if(ds.ioudelyes){ deleteIOU(ds.ioudelyes); return true }
    return false;
  }
  return false;
}
